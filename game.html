// ---- Realistic public finance helpers ----
function gdpIndex(g){
  // Approximates how developed the economy actually is: infrastructure,
  // technology, and the private/corporate sector all widen the real tax base
  // beyond a flat "per head" number.
  const b=g.buildings||{};
  let idx = 1;
  idx += (b.factory||0)*0.05 + (b.oilRig||0)*0.045 + (b.port||0)*0.05 + (b.university||0)*0.06
       + (b.powerPlant||0)*0.045 + (b.mine||0)*0.025 + (b.hospital||0)*0.02;
  idx += Math.min(1.2, (g.res.tech||0)*0.008);
  idx += Math.min(0.6, (g.companies||[]).length*0.05);
  return idx;
}
function taxCompliance(g){
  // Laffer-curve-like collection efficiency: revenue doesn't just rise
  // linearly with the tax rate — push it too high (or leave it oddly low)
  // and compliance falls off; low approval or high unrest widen the
  // informal economy and erode collection further.
  const optimal = 1.05;
  const dist = Math.abs((g.taxRate||1)-optimal);
  let compliance = 1 - dist*0.32;
  compliance -= Math.max(0,(55-g.approval))*0.004;
  compliance -= (g.unrestLevel||0)*0.003;
  return clamp(compliance, 0.45, 1.05);
}

function repayLoan(){
  const g=state.game;
  const amt = Math.min(12000, g.debt, g.res.money);
  if(amt<=0) return;
  g.res.money -= amt;
  g.debt -= amt;
  addLog(`${fmt(amt)} از بدهی بازپرداخت شد.`);
  saveGame(); render();
}

const DAILY_REQUEST_POOL = [
  {item:'pineapple',qty:5,reward:900,subject:'برزیل'},
  {item:'wheat',qty:20,reward:520,subject:'مصر'},
  {item:'medicine',qty:8,reward:1700,subject:'آلمان'},
  {item:'smartphone',qty:10,reward:13500,subject:'هند'},
  {item:'fuel',qty:12,reward:1600,subject:'ترکیه'},
  {item:'fertilizer',qty:15,reward:1200,subject:'آرژانتین'}
];
function generateDailyRequest(g){
  const pool = DAILY_REQUEST_POOL[Math.floor(Math.random()*DAILY_REQUEST_POOL.length)];
  const country = g.allCountries.find(c=>c.name===pool.subject) || g.allCountries.find(c=>c.id!==g.countryId);
  if(!country) return;
  const req={id:'req_'+Date.now()+Math.random().toString(16).slice(2),turn:g.turn,fromId:country.id,item:pool.item,qty:pool.qty,reward:pool.reward,fulfilled:false,expiresTurn:g.turn+4};
  g.dailyRequest=req;
  g.messages.unshift({id:req.id,turn:g.turn,type:'trade',read:false,subject:`درخواست خرید از ${country.name}`,text:`${country.flag} ${country.name} تقاضای خرید ${fmt(req.qty)} واحد ${ITEMS[req.item].name} دارد. مبلغ قرارداد: ${fmt(req.reward)} 💰`});
  if(g.messages.length>30) g.messages.pop();
  addLog(`📨 درخواست خرید جدید: ${country.flag} ${country.name} — ${fmt(req.qty)} واحد ${ITEMS[req.item].name}`);
}
function fulfillDailyRequest(){
  const g=state.game, r=g.dailyRequest;
  if(!r || r.fulfilled || g.turn>r.expiresTurn) return;
  if((g.items[r.item]||0)<r.qty) return;
  g.items[r.item]-=r.qty; g.res.money+=r.reward; g.res.influence+=1; r.fulfilled=true;
  g.messages.unshift({id:'done_'+Date.now(),turn:g.turn,type:'success',read:false,subject:'درخواست تکمیل شد',text:`درخواست خرید ${ITEMS[r.item].name} با موفقیت تحویل شد و ${fmt(r.reward)} 💰 دریافت کردید.`});
  addLog(`🤝 قرارداد خرید ${ITEMS[r.item].name} تکمیل شد: +${fmt(r.reward)} 💰`);
  saveGame(); render();
}
function markMessagesRead(){ if(state.game) state.game.messages.forEach(m=>m.read=true); saveGame(); render(); }
function renderMessages(){
  const g=state.game, r=g.dailyRequest;
  const reqCard = r ? (()=>{ const c=g.allCountries.find(x=>x.id===r.fromId); const enough=(g.items[r.item]||0)>=r.qty; const expired=g.turn>r.expiresTurn; return `<div class="card message-request"><div class="msg-head"><b>📨 ${c?c.flag+' '+c.name:'بازار جهانی'}</b><span class="pill ${r.fulfilled?'pill-g':expired?'pill-r':'pill-gold'}">${r.fulfilled?'تکمیل شد':expired?'منقضی':'درخواست فعال'}</span></div><div style="font-size:13px;margin:8px 0;">تقاضای <b>${fmt(r.qty)} واحد ${ITEMS[r.item].ic} ${ITEMS[r.item].name}</b></div><div style="font-size:11px;color:var(--muted);">پاداش: ${fmt(r.reward)} 💰 + ۱ نفوذ · مهلت: ${Math.max(0,r.expiresTurn-g.turn)} نوبت</div><button class="btn btn-gold" style="width:100%;margin-top:10px;" ${(!enough||r.fulfilled||expired)?'disabled':''} onclick="fulfillDailyRequest()">${enough?'📦 تامین و تحویل':'موجودی کافی نیست'}</button></div>`; })() : '';
  const msgs=(g.messages||[]).map(m=>`<div class="card" style="margin-bottom:7px;${m.read?'opacity:.72':''}"><div style="font-size:12px;font-weight:800;">${m.type==='trade'?'🛒':'✅'} ${m.subject}</div><div style="font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:4px;">${m.text}</div><div style="font-size:10px;color:var(--muted2);margin-top:4px;">نوبت ${m.turn}</div></div>`).join('');
  return `<div class="sec" style="margin-top:0;">📨 پیام‌ها و درخواست‌های تجاری</div>${reqCard}<div class="sec">صندوق پیام</div>${msgs||'<div class="empty">پیامی ندارید.</div>'}`;
}

function simulateWorldAI(g){
  const others=(g.allCountries||[]).filter(c=>c.id!==g.countryId);
  if(!others.length)return;
  const active=[];
  others.forEach(c=>{
    c.money=Number(c.money||50000); c.milBase=Number(c.milBase||50); c.aiTrade=Number(c.aiTrade||0);
    const growth=(0.004+Math.random()*0.012)*(c.tier==='S'?1.15:c.tier==='A'?1.05:1);
    c.money=Math.round(c.money*(1+growth));
    c.milBase=clamp(c.milBase*(1+growth*0.45)+(Math.random()-0.5)*1.2,10,500);
    if(Math.random()<0.35){ c.aiTrade++; c.money+=Math.round(300+Math.random()*900); c.milBase=Math.min(500,c.milBase+0.8); active.push(c); }
    if(Math.random()<0.18){ c.tech=Number(c.tech||0)+1; }
  });
  if(active.length>=2){
    const a=active[Math.floor(Math.random()*active.length)], b=active[Math.floor(Math.random()*active.length)];
    if(a!==b){
      a.money+=600; b.money+=500;
      g.worldNews.unshift({turn:g.turn,year:g.year,text:`🤝 ${a.flag} ${a.name} و ${b.flag} ${b.name} یک قرارداد تجاری جدید امضا کردند.`,icon:'🤝'});
      if(g.worldNews.length>40)g.worldNews.pop();
    }
  }
}

function endTurn(){
  const g=state.game;
  const b=g.buildings, u=g.units, ib=g.itemBuildings, cv=g.covertUnits;
  const diff = gameDiff(g);

  // Production
  let prod = {money:0,food:0,oil:0,steel:0,goods:0,tech:0,influence:0,toranian:0};
  Object.keys(BUILDINGS).forEach(k=>{
    const info=BUILDINGS[k], cnt=b[k]||0;
    if(cnt<=0) return;
    Object.keys(info.prod||{}).forEach(r=> prod[r]=(prod[r]||0)+info.prod[r]*cnt );
  });

  // Item (world-market commodity) production
  Object.keys(ITEM_BUILDINGS).forEach(k=>{
    const info=ITEM_BUILDINGS[k], cnt=ib[k]||0;
    if(cnt<=0) return;
    Object.keys(info.prod||{}).forEach(r=> g.items[r]=(g.items[r]||0)+info.prod[r]*cnt );
  });

  // Domestic consumption of food/basic-goods items — happens before any of
  // it is available to sell abroad next turn.
  const domesticConsumption = consumeDomesticItems(g);
  let shortageText=null;
  if(domesticConsumption.avgRatio<0.4){
    shortageText = '⚠️ کمبود مواد غذایی و اقلام اساسی داخلی نارضایتی عمومی را افزایش داد.';
    addLog(shortageText);
  }

  // Tax — realistic model: tax base scales with actual economic development
  // (infrastructure + tech + corporate sector), and how much of it the state
  // actually collects depends on a Laffer-curve-like compliance factor —
  // rates set too high (evasion) or too low (under-collection) both cost you,
  // and low approval / unrest widen the informal economy further.
  const growthDrag = 1 / (1 + g.turn*0.012);
  const gdpIdx = gdpIndex(g);
  const compliance = taxCompliance(g);
  const nominalRate = 0.45 + g.taxRate*0.55;
  const tax = Math.round(g.pop * 30 * gdpIdx * nominalRate * compliance * growthDrag * diff.taxMult);
  prod.money += tax;

  // Tourism — driven by approval, world stability (average relations), hotels/attractions
  const avgRel = Object.values(g.relations).length ? Object.values(g.relations).reduce((s,v)=>s+v,0)/Object.values(g.relations).length : 0;
  const stability = clamp(50 + avgRel*0.5, 5, 100);
  const tourismCapacity = 400 + (b.hotel||0)*900 + (b.attraction||0)*1600;
  g.tourists = Math.round(tourismCapacity * (g.approval/100) * (stability/100) * (0.85+Math.random()*0.3));
  const tourismRevenue = Math.round(g.tourists * 0.9);
  prod.money += tourismRevenue;

  // Long-term trade agreements: steady recurring income from each active partner
  if(g.tradeDeals && g.tradeDeals.length){
    prod.money += g.tradeDeals.length*700;
    prod.goods += g.tradeDeals.length*3;
  }

  // Tribute from puppet governments
  let tribute = 0;
  if(g.puppets && g.puppets.length){
    g.puppets.forEach(pid=>{
      const p = g.allCountries.find(c=>c.id===pid);
      if(p) tribute += Math.round((p.milBase||50)*3 + (p.money||0)*0.008);
    });
  }
  prod.money += tribute;

  // Upkeep
  let upkeepMoney=0, upkeepFood=0, upkeepOil=0;
  Object.keys(BUILDINGS).forEach(k=>{
    const info=BUILDINGS[k], cnt=b[k]||0;
    if(info.upkeep){
      upkeepMoney += (info.upkeep.money||0)*cnt;
      upkeepOil += (info.upkeep.oil||0)*cnt;
    }
  });
  Object.keys(ITEM_BUILDINGS).forEach(k=>{
    const info=ITEM_BUILDINGS[k], cnt=ib[k]||0;
    if(info.upkeep) upkeepMoney += (info.upkeep.money||0)*cnt;
  });
  Object.keys(UNITS).forEach(k=>{
    const info=UNITS[k], cnt=u[k]||0;
    upkeepMoney += (info.upkeep.money||0)*cnt;
    upkeepFood += (info.upkeep.food||0)*cnt;
    upkeepOil += (info.upkeep.oil||0)*cnt;
  });
  Object.keys(COVERT_UNITS).forEach(k=>{
    const info=COVERT_UNITS[k], cnt=cv[k]||0;
    if(info.upkeep){
      upkeepMoney += (info.upkeep.money||0)*cnt;
      prod.tech -= (info.upkeep.tech||0)*cnt;
    }
  });
  upkeepMoney = Math.round(upkeepMoney * diff.upkeepMult);
  // Sanctions imposed by others hurt trade income slightly (flavor penalty on tax)
  if(g.sanctions && g.sanctions.length) upkeepMoney += g.sanctions.length*250;
  const debtInt = Math.round(g.debt*0.05);

  // Critical infrastructure (oil/power/water): a sustained multi-turn shortage
  // (not just this turn's dip) drags down production and approval until fixed.
  const infra = assessInfrastructure(g, prod, upkeepOil);

  // Apply
  g.res.money += prod.money - upkeepMoney - debtInt;
  g.res.food += prod.food - upkeepFood;
  g.res.oil += prod.oil - upkeepOil;
  g.res.steel += prod.steel;
  g.res.goods += prod.goods;
  g.res.toranian += prod.toranian;
  g.res.tech += prod.tech;
  g.res.influence += prod.influence;
  g.debt += debtInt;

  // Clamp resources
  Object.keys(g.res).forEach(k=>{ if(g.res[k]<0) g.res[k]=0; });

  // Population & approval
  const foodFactor = g.res.food > g.pop*1.2 ? 1.002 : (g.res.food < g.pop*0.6 ? 0.994 : 1.0);
  g.pop = Math.max(3, g.pop * foodFactor * (1 + (b.hospital||0)*0.0004));
  if(g.taxRate>1.1) g.approval=clamp(g.approval-1.6);
  else if(g.taxRate<0.9) g.approval=clamp(g.approval+0.6);
  g.approval = clamp(g.approval + (b.university||0)*0.25 + (b.hospital||0)*0.4 + (b.farm||0)*0.08 - 0.5);

  // Companies simulation
  const corpTax = simulateCompanies(g);

  // Military campaigns: advance travel time, resolve engaged battles
  processCampaigns(g);

  // Import shipments: advance travel time, deliver arrived cargo
  processShipments(g);

  // Smart world simulation: other countries grow, trade and invest every turn.
  simulateWorldAI(g);
  simulateLivingCountries(g);
  aiCompanyExports(g);
  triggerSmartEvent(g);

  // World market price drift (random walk, mean-reverting) — staple goods
  // barely move, rare/luxury goods (gold, saffron) swing much harder, like real markets.
  Object.keys(g.marketPrices).forEach(id=>{
    let m = g.marketPrices[id];
    const vol = ITEM_VOLATILITY[ITEMS[id]?.cat] || 0.10;
    m += (1-m)*0.08 + (Math.random()-0.5)*vol;
    g.marketPrices[id] = Math.max(0.4, Math.min(2.2, m));
  });

  // World news (also nudges one market price / the president directly)
  let newsText=null;
  if(Math.random()<0.55){
    const n = NEWS_TEMPLATES[Math.floor(Math.random()*NEWS_TEMPLATES.length)];
    if(n.item) g.marketPrices[n.item] = Math.max(0.4, Math.min(2.5, (g.marketPrices[n.item]||1)*n.mult));
    if(n.effect) n.effect(g);
    g.worldNews.unshift({turn:g.turn, year:g.year, text:n.text, icon:n.icon});
    if(g.worldNews.length>40) g.worldNews.pop();
    newsText = n.text;
  }

  // Domestic event — difficulty raises the chance of a negative-leaning turn
  let eventText=null;
  if(Math.random()<diff.negEventChance){
    const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];
    ev.apply(g);
    addLog(ev.text);
    eventText=ev.text;
  }

  // Domestic crisis — a bigger shock that pauses for the president's response
  if(!g.pendingCrisis && Math.random() < diff.negEventChance*0.35){
    const crisis = CRISES[Math.floor(Math.random()*CRISES.length)];
    crisis.onTrigger(g);
    g.pendingCrisis = {id:crisis.id, turn:g.turn};
    addLog(`${crisis.ic} بحران: ${crisis.name} کشور را درگیر کرده است.`);
  }

  // Unrest / real challenge: sustained low approval or deep debt risks losing office
  let crisisText=null;
  if(g.approval<diff.unrestThreshold || g.debt>g.res.money*6+40000){
    g.lowApprovalStreak++;
  } else {
    g.lowApprovalStreak = Math.max(0, g.lowApprovalStreak-1);
  }
  if(g.lowApprovalStreak>=2){
    g.unrestLevel = clamp(g.unrestLevel + 12);
    crisisText = `⚠️ نارضایتی عمومی در حال افزایش است (سطح ناآرامی: ${Math.round(g.unrestLevel)}٪)`;
    addLog(crisisText);
  } else {
    g.unrestLevel = clamp(g.unrestLevel - 6);
  }
  if(g.unrestLevel>=100 || g.res.money < -60000){
    state.screen='gameover';
    state.game.overReason = g.unrestLevel>=100 ? 'unrest' : 'bankrupt';
    saveGame(); render();
    return;
  }

  g.turn++;
  // Game time is intentionally slower: four player turns represent one in-game day.
  // The turn counter still advances every action, while the calendar/day-night cycle moves every fourth turn.
  if(g.turn % 4 === 0){ advanceDate(g); generateDailyRequest(g); }
  const hostileAttack = maybeTriggerHostileAttack(g);
  // Soft decay relations toward 0
  Object.keys(g.relations).forEach(id=>{
    g.relations[id] = Math.round(g.relations[id]*0.97);
  });

  // Yearly natural disaster — rolls once per calendar year, at most once per year
  let disasterText=null;
  if(g.date.year !== g.lastDisasterYear){
    g.lastDisasterYear = g.date.year;
    if(Math.random() < 0.6){
      disasterText = triggerYearlyDisaster(g);
    }
  }

  state.lastSummary = {
    tax, taxCompliancePct: Math.round(compliance*100), corpTax,
    prodMoney:prod.money-tax-tourismRevenue, food:prod.food, oil:prod.oil, steel:prod.steel,
    tourismRevenue, tourists:g.tourists,
    domesticFoodPct: Math.round(domesticConsumption.food.ratio*100),
    domesticBasicPct: Math.round(domesticConsumption.basic.ratio*100),
    oilPct: Math.round(Math.min(1,infra.ratios.oil.ratio)*100),
    powerPct: Math.round(Math.min(1,infra.ratios.power.ratio)*100),
    waterPct: Math.round(Math.min(1,infra.ratios.water.ratio)*100),
    infraTexts: infra.texts,
    cascadeText: infra.cascadeText,
    upkeep:upkeepMoney+debtInt, eventText, newsText, crisisText, disasterText,
    net: prod.money - upkeepMoney - debtInt + corpTax
  };
  refreshTargets();
  if(g.pendingAttack && (!state.modal || state.modal.type!=='hostileAttack')){
    state.modal = {type:'hostileAttack'};
  } else if(g.pendingConquests && g.pendingConquests.length && (!state.modal || state.modal.type!=='conquestChoice')){
    state.modal = {type:'conquestChoice', id: g.pendingConquests[0].targetId};
  } else if(g.pendingDisaster && (!state.modal || state.modal.type!=='disasterChoice')){
    state.modal = {type:'disasterChoice'};
  } else if(g.pendingCrisis && (!state.modal || state.modal.type!=='crisisChoice')){
    state.modal = {type:'crisisChoice'};
  }
  saveGame();
  render();
}

// ================== PERIODIC AI ATTACKS ==================
function maybeTriggerHostileAttack(g){
  if(!g || g.pendingAttack) return null;
  // Exactly one AI attack every five in-game years after the start year.
  const startYear = g.startYear || (g.date?.year || g.year);
  if(g.date.year <= startYear || (g.date.year - startYear) % 5 !== 0) return null;
  if(g.lastHostileAttackYear === g.date.year) return null;
  const candidates = g.allCountries.filter(c=>c.id!==g.countryId && !(g.conquered||[]).includes(c.id) && !(g.puppets||[]).includes(c.id) && !(g.alliances||[]).includes(c.id));
  if(!candidates.length) return null;
  candidates.sort((a,b)=>((g.relations[b.id]||0)-(g.relations[a.id]||0)));
  const pool=candidates.slice(0,Math.max(3,Math.ceil(candidates.length*0.45)));
  const attacker=pool[Math.floor(Math.random()*pool.length)];
  g.lastHostileAttackYear=g.date.year;
  g.pendingAttack={attackerId:attacker.id, year:g.date.year, attackerPower:Math.max(0.1,Number((attacker.milBase*0.018).toFixed(2)))};
  addLog(`⚠️ ${attacker.flag} ${attacker.name} در سال ${g.date.year} به کشور شما حمله کرد.`);
  return attacker;
}
function resolveHostileAttack(defend=true){
  const g=state.game;
  const a=g.pendingAttack;
  if(!a) return;
  const attacker=g.allCountries.find(c=>c.id===a.attackerId);
  if(!attacker){ g.pendingAttack=null; state.modal=null; saveGame(); render(); return; }
  const own=Math.max(0.01,milPower());
  const enemy=Math.max(0.01,a.attackerPower);
  if(defend){
    const ratio=own/(own+enemy);
    if(ratio>=0.5){
      const loss=Math.max(0,Math.round(enemy*0.08));
      g.res.money=Math.max(0,g.res.money-loss*18);
      g.res.steel=Math.max(0,g.res.steel-Math.round(loss*0.03));
      g.approval=clamp(g.approval+1);
      g.relations[attacker.id]=clamp((g.relations[attacker.id]||0)-12,-100,100);
      addLog(`🛡️ حمله ${attacker.flag} ${attacker.name} دفع شد؛ خسارت اقتصادی محدود وارد شد.`);
    }else{
      const loss=Math.max(1,Math.round(enemy*0.12));
      g.res.money=Math.max(0,g.res.money-loss*35);
      g.res.steel=Math.max(0,g.res.steel-Math.round(loss*0.06));
      g.res.food=Math.max(0,g.res.food-Math.round(g.pop*0.12));
      g.approval=clamp(g.approval-4);
      g.milBase=Math.max(1,Math.round(g.milBase*0.985));
      addLog(`⚠️ حمله ${attacker.flag} ${attacker.name} با هزینه سنگین دفع شد؛ بخشی از منابع و توان دفاعی آسیب دید.`);
    }
  }else{
    g.res.money=Math.max(0,g.res.money-Math.round(enemy*22));
    g.res.food=Math.max(0,g.res.food-Math.round(g.pop*0.08));
    g.approval=clamp(g.approval-6);
    addLog(`🏳️ دولت از رویارویی مستقیم با ${attacker.flag} ${attacker.name} صرف‌نظر کرد؛ مهاجم بخشی از منابع کشور را گرفت.`);
  }
  g.pendingAttack=null;
  state.modal=null;
  saveGame(); render();
}

// ================== SAVE / LOAD ==================
const SAVE_KEY = 'golden_president_save_v2';
function saveGame(){
  if(!state.game) return false;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      version: 3,
      scenario: state.scenario,
      game: state.game,
      savedAt: Date.now()
    }));
    return true;
  }catch(e){
    return false;
  }
}

function manualSaveGame(){
  if(!state.game) return;
  const ok = saveGame();
  state.toast = ok ? '✅ تمام دارایی‌ها و وضعیت فعلی بازی ذخیره شد' : '⚠️ ذخیره بازی انجام نشد';
  render();
  setTimeout(()=>{
    state.toast=null;
    render();
  }, 1800);
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(!data.game || !data.scenario) return false;
    state.scenario = data.scenario;
    state.game = data.game;
    state.screen = 'game';
    state.tab = 'home';
    ensureGameDefaults();
    return true;
  }catch(e){ return false; }
}
function hasSave(){
  try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; }
}
function clearSave(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}

  {id:'gp_capital_180k', icon:'💰', title:'سرمایه حرفه‌ای', desc:'۱۸۰٬۰۰۰ بودجه داخل بازی', price:149000, type:'consumable', grant:{money:180000}},
  {id:'gp_capital_400k', icon:'💎', title:'سرمایه بزرگ', desc:'۴۰۰٬۰۰۰ بودجه داخل بازی', price:299000, type:'consumable', grant:{money:400000}},
  {id:'gp_premium', icon:'👑', title:'باشگاه رئیس‌جمهور', desc:'۱٬۰۰۰٬۰۰۰ بودجه + ۲۵ نفوذ + حذف تبلیغات', price:499000, type:'non_consumable', grant:{money:1000000,influence:25}, premium:true},
  {id:'gp_no_ads', icon:'🚫', title:'حذف تبلیغات', desc:'تبلیغات مزاحم برای همیشه غیرفعال می‌شود', price:199000, type:'non_consumable', grant:{}, noAds:true}
];
function rial(n){return Math.round(n).toLocaleString('fa-IR')+' ریال';}
function getStoreProduct(id){return STORE_PRODUCTS.find(x=>x.id===id);}
function isAdsRemoved(){return !!(state.game&&state.game.store&&state.game.store.owned&&state.game.store.owned.no_ads);}
function applyStoreGrant(product){
  const g=state.game; if(!g||!product) return;
  g.store=g.store||{owned:{no_ads:false,premium:false},purchases:[],rewardedAds:0};
  g.store.owned=g.store.owned||{no_ads:false,premium:false};
  const grant=product.grant||{};
  if(grant.money) g.res.money=(g.res.money||0)+grant.money;
  if(grant.influence) g.res.influence=(g.res.influence||0)+grant.influence;
  if(product.noAds) g.store.owned.no_ads=true;
  if(product.premium){g.store.owned.premium=true;g.store.owned.no_ads=true;}
  g.store.purchases.push({id:product.id,at:Date.now()});
  addLog(`🛒 خرید «${product.title}» با موفقیت اعمال شد.`);
  saveGame();
}
function requestStorePurchase(id){
  const p=getStoreProduct(id); if(!p||!state.game||state.storeBusy) return;
  if((p.noAds&&isAdsRemoved()) || (p.premium&&state.game.store?.owned?.premium)){ state.toast='این محصول قبلاً فعال شده است'; render(); setTimeout(()=>{state.toast=null;render()},1500); return; }
  state.storeBusy=true; render();
  try{
    if(window.MyketBridge && typeof window.MyketBridge.purchase==='function'){
      window.MyketBridge.purchase(p.id);
    }else if(window.Android && typeof window.Android.purchase==='function'){
      window.Android.purchase(p.id);
    }else{
      state.storeBusy=false;
      state.toast='اتصال خرید مایکت در WebView هنوز فعال نشده است'; render();
      setTimeout(()=>{state.toast=null;render()},2200);
    }
  }catch(e){state.storeBusy=false;state.toast='خطا در شروع خرید';render();setTimeout(()=>{state.toast=null;render()},1800);}
}
window.onMyketPurchaseSuccess=function(productId){
  const p=getStoreProduct(productId); state.storeBusy=false;
  if(p) applyStoreGrant(p);
  state.toast=p?`✅ ${p.title} فعال شد`:'✅ خرید موفق بود'; render();
  setTimeout(()=>{state.toast=null;render()},1800);
};
window.onMyketPurchaseFailed=function(message){state.storeBusy=false;state.toast='خرید انجام نشد'+(message?` — ${message}`:'');render();setTimeout(()=>{state.toast=null;render()},2200);};
window.onMyketPurchaseRestored=function(productId){const p=getStoreProduct(productId); if(!p||!state.game)return; state.game.store=state.game.store||{owned:{no_ads:false,premium:false},purchases:[],rewardedAds:0}; state.game.store.owned=state.game.store.owned||{no_ads:false,premium:false}; if(p.noAds||p.premium)state.game.store.owned.no_ads=true; if(p.premium)state.game.store.owned.premium=true; saveGame();render();};
function requestRestorePurchases(){
  try{ if(window.MyketBridge&&typeof window.MyketBridge.restore==='function'){window.MyketBridge.restore();return;} if(window.Android&&typeof window.Android.restore==='function'){window.Android.restore();return;} }catch(e){}
  state.toast='بازیابی خریدها به اتصال مایکت در WebView نیاز دارد';render();setTimeout(()=>{state.toast=null;render()},2200);
}
function showRewardedAd(){
  if(!state.game) return;
  if(isAdsRemoved()){state.toast='تبلیغات حذف شده است';render();setTimeout(()=>{state.toast=null;render()},1500);return;}
  try{
    if(window.MyketBridge&&typeof window.MyketBridge.showRewarded==='function'){state.storeBusy=true;render();window.MyketBridge.showRewarded();return;}
    if(window.Android&&typeof window.Android.showRewarded==='function'){state.storeBusy=true;render();window.Android.showRewarded();return;}
  }catch(e){}
  state.toast='نمایش تبلیغ جایزه‌ای به اتصال SDK مایکت نیاز دارد';render();setTimeout(()=>{state.toast=null;render()},2200);
}
window.onMyketRewardedCompleted=function(){
  if(!state.game)return; state.storeBusy=false; state.game.store=state.game.store||{owned:{no_ads:false,premium:false},purchases:[],rewardedAds:0}; state.game.store.rewardedAds=(state.game.store.rewardedAds||0)+1; state.game.res.money=(state.game.res.money||0)+5000; addLog('🎁 تبلیغ جایزه‌ای تماشا شد و ۵٬۰۰۰ بودجه دریافت کردید.'); saveGame(); state.toast='🎁 ۵٬۰۰۰ بودجه دریافت شد';render();setTimeout(()=>{state.toast=null;render()},1800);
};
window.onMyketRewardedFailed=function(){state.storeBusy=false;state.toast='تبلیغ جایزه‌ای در دسترس نبود';render();setTimeout(()=>{state.toast=null;render()},1800);};
function showInterstitialAd(){
  if(!state.game || isAdsRemoved()) return false;
  try{
    if(window.MyketBridge && typeof window.MyketBridge.showInterstitial==='function'){ window.MyketBridge.showInterstitial(); return true; }
    if(window.Android && typeof window.Android.showInterstitial==='function'){ window.Android.showInterstitial(); return true; }
  }catch(e){}
  return false;
}
function maybeShowStartupAd(){
  if(!state.game || isAdsRemoved()) return;
  try{
    if(sessionStorage.getItem('gp_startup_ad_shown')==='1') return;
    sessionStorage.setItem('gp_startup_ad_shown','1');
  }catch(e){}
  // Occasional interstitial: roughly 35% of fresh game launches, never repeatedly on re-render.
  if(Math.random() < 0.35){ setTimeout(()=>showInterstitialAd(), 1800); }
}

function renderStore(){
  const g=state.game; const owned=g.store?.owned||{};
  const products=STORE_PRODUCTS.map(p=>{
    const active=(p.noAds&&owned.no_ads)||(p.premium&&owned.premium);
    return `<div class="store-product"><div class="sp-ic">${p.icon}</div><h4>${p.title}</h4><div class="sp-desc">${p.desc}</div><div class="sp-price">${rial(p.price)}</div><button ${active||state.storeBusy?'disabled':''} onclick="requestStorePurchase('${p.id}')">${active?'فعال شده ✓':state.storeBusy?'در حال پردازش…':'خرید'}</button></div>`;
  }).join('');
  return `<div class="store-hero"><h3>🛒 فروشگاه بازی</h3><p>خریدها برای همین بازی ثبت می‌شوند. در نسخه WebView، پرداخت واقعی از طریق Bridge مایکت انجام می‌شود.</p></div>

  <div class="ad-card"><div class="ad-title">🎬 تبلیغ جایزه‌ای</div><div class="ad-sub">با تماشای تبلیغ، ۵٬۰۰۰ بودجه دریافت کنید.</div><button ${state.storeBusy||isAdsRemoved()?'disabled':''} onclick="showRewardedAd()">${isAdsRemoved()?'تبلیغات حذف شده':'تماشای تبلیغ +۵٬۰۰۰'}</button></div>
  <button class="btn btn-ghost" style="width:100%;margin-top:5px;" onclick="requestRestorePurchases()">♻️ بازیابی خریدهای مایکت</button>`;
}

// ================== RENDER ==================
function render(){
  const app=document.getElementById('app');
  if(state.screen==='mainmenu') app.innerHTML = renderMainMenu();
  else if(state.screen==='newgame') app.innerHTML = renderNewGame();
  else if(state.screen==='settings') app.innerHTML = renderSettings();
  else if(state.screen==='loadslots') app.innerHTML = renderLoadSlots();
  else if(state.screen==='select') app.innerHTML = renderSelect();
  else if(state.screen==='game') app.innerHTML = renderGame();
  else if(state.screen==='gameover') app.innerHTML = renderGameOver();
  if(state.modal) app.innerHTML += renderModal();
  if(state.toast) app.innerHTML += `<div class="toast">${state.toast}</div>`;
}

      return `<div class="slot-card empty"><div class="slot-ic">📁</div><div class="slot-main"><b>اسلات ${n}</b><p>خالی</p></div></div>`;
    }
    const gm = info.game;
    return `<div class="slot-card">
      <div class="slot-ic">${gm.flag||'🏳️'}</div>
      <div class="slot-main">
        <b>اسلات ${n} — ${gm.countryName||''}</b>

      </div>
      <div class="slot-actions">
        <button class="a-btn gold" onclick="loadFromSlot(${n})">بارگذاری</button>

  }).join('');
  return `

    <div class="select-header">
      <div class="seal sm"><div class="si">💾</div></div>

function updateCountryStatus(g){
  const b=g.buildings||{}; const total=Object.values(b).reduce((a,v)=>a+(v||0),0);
  const power=(b.powerPlant||0)*10+(b.powerGrid||0)*14; const water=(b.waterPlant||0)*10+(b.waterNetwork||0)*12;
  const pollution=(b.oilRig||0)*4+(b.factory||0)*2+(b.powerPlant||0)*2-(b.sewagePlant||0)*4;
  const infra=((g.infra?.oil||0)+(g.infra?.power||0)+(g.infra?.water||0));
  const health=clamp(50+(b.hospital||0)*7+water*0.5-pollution*0.7);
  const cleanAir=clamp(78-pollution*1.2+(b.powerGrid||0)*2+(b.sewagePlant||0)*4+(b.roadNetwork||0)*0.5);
  const calm=clamp(75-(g.unrestLevel||0)*0.8+(g.approval||0)*0.18+(b.roadNetwork||0)*0.5+(b.waterNetwork||0)*0.7);
  const employment=clamp(45+total*2+(g.companies?.length||0)*5+(b.industrialPark||0)*3);
  const welfare=clamp((health+cleanAir+calm+employment)/4);
  g.countryStatus={welfare,calm,influence:clamp((g.res.influence||0)+((g.buildings.embassy||0)*2)+(g.puppets?.length||0),0,100),cleanAir,health,employment,energySecurity:clamp(35+power-infra*2+(b.dataCenter||0)*0.4)};
}
function renderCountryStatus(){
  const g=state.game; updateCountryStatus(g); const s=g.countryStatus;

// ---- Domestic item consumption ----
// Commodities aren't just an export product anymore: the population itself
// eats through part of the food/basic-goods stock every turn before any of
// it can be sold abroad. Selling everything at once (sellAllItems) leaves
// nothing for domestic needs and hits approval the next turn.
const CONSUMABLE_FOOD_ITEMS = ['wheat','corn','coconut','banana','pineapple','orange','peach','watermelon','melon','milk','meat'];
const CONSUMABLE_BASIC_ITEMS = ['water','salt','sugar','sugarCube'];
function consumeDomesticItems(g){
  function consumeGroup(ids, need){
    const available = ids.reduce((s,id)=>s+(g.items[id]||0),0);
    const consumed = Math.min(available, need);
    if(available>0 && consumed>0){
      ids.forEach(id=>{
        const stock=g.items[id]||0;
        if(stock<=0) return;
        g.items[id] = Math.max(0, stock - consumed*(stock/available));
      });
    }
    return {need, available, consumed, ratio: need>0 ? consumed/need : 1};
  }
  const foodNeed = Math.round(g.pop*0.22);
  const basicNeed = Math.round(g.pop*0.12);
  const food = consumeGroup(CONSUMABLE_FOOD_ITEMS, foodNeed);
  const basic = consumeGroup(CONSUMABLE_BASIC_ITEMS, basicNeed);
  const avgRatio = (food.ratio+basic.ratio)/2;
  let approvalDelta;
  if(avgRatio>=0.95) approvalDelta = 0.5;
  else if(avgRatio>=0.7) approvalDelta = 0.25;
  else if(avgRatio>=0.4) approvalDelta = -0.3;
  else approvalDelta = -0.8;
  g.approval = clamp(g.approval + approvalDelta);
  return {food, basic, avgRatio, approvalDelta};
}

// ---- Critical infrastructure (oil / electricity / water) ----
// Unlike day-to-day food consumption, a single bad turn on oil, power or
// water shouldn't cripple the country — real infrastructure has slack.
// Instead we track a running "streak" of bad turns per resource; only once
// supply has been failing to meet demand for several turns in a row does it
// become a structural crisis with real, ongoing penalties to production and
// approval. The player is always given a concrete fix: either the normal
// building menu (oil rigs / power plants / water plants), or an immediate
// but pricier emergency investment (see investInfrastructure).
const INFRA_INFO = {
  oil:   {ic:'🛢️', name:'نفت', fixName:'واردات اضطراری نفت'},
  power: {ic:'⚡', name:'برق', fixName:'نیروگاه اضطراری'},
  water: {ic:'💧', name:'آب', fixName:'تصفیه‌خانه اضطراری'}
};
// New games get a one in-game-year (365 turns = 365 days) grace period before
// structural oil/power/water shortages start being tracked and penalized, so
// the player has real time to build an oil rig, a power plant and a water
// plant first. infraGraceTurnsLeft() is also used by the UI to show a countdown.
const INFRA_GRACE_TURNS = 365;
function infraInGrace(g){
  const start = (g.startTurn===undefined) ? 1 : g.startTurn;
  return (g.turn - start) < INFRA_GRACE_TURNS;
}
function infraGraceTurnsLeft(g){
  const start = (g.startTurn===undefined) ? 1 : g.startTurn;
  return Math.max(0, INFRA_GRACE_TURNS - (g.turn - start));
}
function infraDemand(g, upkeepOil, prod, prevCritical){
  prod = prod || {oil:0, steel:0, food:0};
  prevCritical = prevCritical || {oil:false, power:false, water:false};
  const b = g.buildings||{};
  const totalBuildings = Object.values(b).reduce((s,v)=>s+(v||0),0);
  // Cross-dependencies: a resource that's ALREADY in structural crisis this
  // turn drags down the others that depend on it, so shortages cascade
  // instead of sitting in isolated silos.
  // - Power crisis: mines/oil-rigs run heavy machinery on electricity, so
  //   their output (and thus this turn's oil/steel) suffers.
  // - Oil crisis: oil-fired power plants can't run at full capacity.
  // - Water crisis: irrigation fails, hurting food output.
  const oilProdAdj = prevCritical.power ? prod.oil*0.75 : prod.oil;
  const steelProdAdj = prevCritical.power ? prod.steel*0.75 : prod.steel;
  const powerCapBase = 20 + (b.powerPlant||0)*45;
  const powerCapacity = prevCritical.oil ? Math.round(powerCapBase*0.7) : powerCapBase;
  const oilAvailable = (g.res.oil||0) + oilProdAdj;
  const oilRatio = upkeepOil>0 ? clamp(oilAvailable/upkeepOil, 0, 2) : 1;
  const powerDemand = Math.round(g.pop*2.2 + totalBuildings*1.5 + (g.companies?g.companies.length*12:0));
  const powerRatio = powerDemand>0 ? clamp(powerCapacity/powerDemand, 0, 2) : 1;
  const waterNeed = Math.round(g.pop*0.08);
  const waterStock = g.items?.water||0;
  const waterRatio = waterNeed>0 ? clamp(waterStock/waterNeed, 0, 2) : 1;
  return {
    oil:   {ratio:oilRatio,   demand:upkeepOil,   capacity:g.res.oil||0, prodAdj:oilProdAdj},
    power: {ratio:powerRatio, demand:powerDemand, capacity:powerCapacity},
    water: {ratio:waterRatio, demand:waterNeed,   capacity:waterStock},
    steelProdAdj
  };
}
function assessInfrastructure(g, prod, upkeepOil){
  const grace = infraInGrace(g);
  const prevCritical = {oil:(g.infra.oil||0)>=4, power:(g.infra.power||0)>=4, water:(g.infra.water||0)>=4};
  const ratios = infraDemand(g, upkeepOil, prod, prevCritical);

  // During the first in-game year, shortages are visible (so the player can
  // see the percentages and plan) but carry no streak build-up and no
  // penalties at all — this is the construction grace period.
  if(grace){
    const turnsLeft = infraGraceTurnsLeft(g);
    // Warn once as the grace period is about to end, so it isn't a surprise.
    let graceText = null;
    if(turnsLeft===30 || turnsLeft===7){
      graceText = `🕊️ ${turnsLeft} روز تا پایان دوره معافیت زیرساخت باقی مانده — اگر دکل نفت، نیروگاه و تصفیه‌خانه کافی نسازید، کمبود از این پس مجازات خواهد داشت.`;
      addLog(graceText);
    }
    return {ratios, numCritical:0, texts:[], cascadeActive:false, cascadeText:null, grace:true, graceTurnsLeft:turnsLeft, graceText};
  }

  // The turn grace period ends is worth a one-time heads-up in the log.
  const start = (g.startTurn===undefined) ? 1 : g.startTurn;
  if(g.turn - start === INFRA_GRACE_TURNS){
    addLog('⏳ دوره معافیت یک‌ساله زیرساخت به پایان رسید — از این پس کمبود ساختاری نفت، برق یا آب به‌طور مستقیم تولید و محبوبیت را کاهش می‌دهد.');
  }

  // Apply the cascade effects to this turn's actual production, not just
  // the display ratios above.
  if(prevCritical.power){ prod.oil = Math.round(prod.oil*0.75); prod.steel = Math.round(prod.steel*0.75); }
  if(prevCritical.water){ prod.food = Math.round(prod.food*0.8); }
  const cascadeActive = [prevCritical.oil, prevCritical.power, prevCritical.water].filter(Boolean).length >= 2;

  const texts = [];
  let numCritical = 0;
  Object.keys(INFRA_INFO).forEach(k=>{
    const r = ratios[k].ratio;
    if(r < 0.32) g.infra[k] = Math.min(6, (g.infra[k]||0)+1);
    else g.infra[k] = Math.max(0, (g.infra[k]||0)-1);
    if(g.infra[k] >= 4){
      numCritical++;
      const info = INFRA_INFO[k];
      texts.push(`${info.ic} کمبود ساختاری ${info.name} (${g.infra[k]} نوبت متوالی) به تولید و محبوبیت آسیب می‌زند — از منوی ساخت‌وساز یا اقدام اضطراری برای رفع آن استفاده کنید.`);
    }
  });
  if(numCritical>0){
    // Ongoing, compounding penalties while the shortage is structural —
    // not just this turn's flavor text, but a real drag until it's fixed.
    prod.money = Math.round(prod.money * (1 - 0.015*numCritical));
    prod.goods = Math.round(prod.goods * (1 - 0.015*numCritical));
    if(g.infra.power>=3) prod.tech = Math.round(prod.tech * 0.93);
    g.approval = clamp(g.approval - 0.25*numCritical);
    texts.forEach(t=>addLog(t));
  }
  let cascadeText = null;
  if(cascadeActive){
    // Two or more infrastructure crises feeding each other at once is a
    // systemic breakdown, not just three separate problems — extra hit.
    cascadeText = '🌐 بحران زنجیره‌ای زیرساخت: کمبودهای همزمان یکدیگر را تشدید کرده‌اند و اقتصاد را به‌شدت تحت فشار گذاشته‌اند.';
    g.approval = clamp(g.approval - 0.8);
    g.unrestLevel = clamp((g.unrestLevel||0) + 1.5);
    addLog(cascadeText);
  }
  return {ratios, numCritical, texts, cascadeActive, cascadeText, grace:false, graceTurnsLeft:0};
}
function infraFixCost(type, g){
  return {money: Math.round(6000 + (g.infra[type]||0)*2500)};
}
function investInfrastructure(type){
  const g=state.game;
  const cost = infraFixCost(type, g);
  if(!canAfford(cost)) return;
  pay(cost);
  if(type==='oil'){
    g.res.oil += 60;
    addLog('🛢️ محموله اضطراری نفت وارد شد و کمبود موقتاً جبران شد.');
  } else if(type==='power'){
    g.buildings.powerPlant = (g.buildings.powerPlant||0)+1;
    addLog('⚡ یک نیروگاه اضطراری با هزینه بالا و سرعت زیاد احداث شد.');
  } else if(type==='water'){
    g.itemBuildings.waterPlant = (g.itemBuildings.waterPlant||0)+1;
    g.items.water = (g.items.water||0)+40;
    addLog('💧 یک تصفیه‌خانه اضطراری احداث و ذخیره آب تقویت شد.');
  }
  g.infra[type] = Math.max(0, (g.infra[type]||0)-3);
  saveGame(); render();
}

function renderCarRndTree(co){
  ensureCarResearch(co);
  const active = co.research.active;
  const activeCat = active ? CAR_RESEARCH_TREE.find(c=>c.key===active.catKey) : null;
  const activeOpt = active && activeCat ? activeCat.options.find(o=>o.id===active.optId) : null;
  let html = '';
  if(active && activeOpt){
    html += `<div class="card" style="text-align:center;padding:14px;margin-bottom:10px;">
      <div style="font-size:12px;color:var(--muted);">در حال تحقیق</div>
      <div style="font-size:15px;font-weight:800;margin:4px 0;">${activeOpt.ic} ${activeOpt.name} <span style="color:var(--muted);font-size:11.5px;">(${activeCat.name})</span></div>
      <div id="rndCountdown" style="font-size:22px;font-weight:900;color:var(--gold2);">${formatCountdown(active.completesAt-Date.now())}</div>
    </div>`;
  } else {
    html += `<p style="font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:8px;">هر تحقیق ۳ دقیقه زمان می‌برد؛ در این مدت می‌توانید کارهای دیگر کشور را انجام دهید.</p>`;
  }
  CAR_RESEARCH_TREE.forEach(cat=>{
    const unlockedIds = co.research.unlocked[cat.key]||[];
    html += `<div class="sec">${cat.name}</div><div class="chips" style="flex-wrap:wrap;overflow:visible;">`;
    cat.options.forEach(opt=>{
      const isUnlocked = opt.base || unlockedIds.includes(opt.id);
      const isActive = !!(active && active.catKey===cat.key && active.optId===opt.id);
      if(isUnlocked){
        html += `<span class="chip on">${opt.ic} ${opt.name} ✓</span>`;
      } else if(isActive){
        html += `<span class="chip" style="opacity:.75;">${opt.ic} ${opt.name} ⏳</span>`;
      } else {
        const disabled = !!active || !canAfford(opt.cost);
        html += `<button class="chip" ${disabled?'disabled':''} style="${disabled?'opacity:.4;':''}" onclick="startCarResearch('${co.id}','${cat.key}','${opt.id}')">${opt.ic} ${opt.name} · 💰${fmt(opt.cost.money)} 🔬${opt.cost.tech}</button>`;
      }
    });
    html += `</div>`;
  });
  return html;
}

function renderEconomy(){
  const g=state.game;
  const resHtml = Object.keys(RESOURCES).map(k=>{
    const r=RESOURCES[k];
    return `<div class="res"><div class="ic">${r.ic}</div><div class="v">${fmt(g.res[k]||0)}</div><div class="lb">${r.name}</div></div>`;
  }).join('');

  const builds = Object.keys(BUILDINGS).map(k=>{
    const info=BUILDINGS[k], cnt=g.buildings[k]||0;
    const costStr = Object.keys(info.cost).map(r=>`${RESOURCES[r]?.ic||''}${fmt(info.cost[r])}`).join(' ');
    const prodStr = Object.keys(info.prod||{}).map(r=>`+${info.prod[r]}${RESOURCES[r]?.ic||''}`).join(' ') || '—';
    const geoOk = canBuildCoreBuilding(g.countryId, k);
    const atCap = cnt >= buildingLimit(g,k);
    const dis = (!geoOk || atCap || !canAfford(info.cost)) ? 'disabled' : '';
    return `<div class="card a-card">
      <div class="a-ic">${info.ic}</div>
      <div class="a-main">
        <div class="a-name"><span class="a-cnt">${cnt}</span>${info.name}</div>
        <div class="a-meta">${info.desc} · هزینه: ${costStr} · تولید: ${prodStr}</div>
        ${!geoOk?`<div class="a-meta" style="color:var(--crimson);margin-top:2px;">🚫 ${geoRestrictionNote(k)}</div>`:''}
        ${atCap?`<div class="a-meta" style="color:var(--gold2);">📏 سقف ساخت: ${buildingLimit(g,k)}</div>`:''}
      </div>
      <button class="a-btn gold" ${dis} onclick="build('${k}')">ساخت</button>
    </div>`;
  }).join('');

  const infraRatios = infraDemand(g, (function(){
    // Recompute the oil upkeep figure for display purposes only (endTurn
    // recomputes its own copy when it actually runs the turn).
    let upkeepOil=0;
    Object.keys(BUILDINGS).forEach(k=>{ upkeepOil += (BUILDINGS[k].upkeep?.oil||0)*(g.buildings[k]||0); });
    Object.keys(UNITS).forEach(k=>{ upkeepOil += (UNITS[k].upkeep?.oil||0)*(g.units[k]||0); });
    return upkeepOil;
  })());
  const infraGrace = infraInGrace(g);
  const infraCard = Object.keys(INFRA_INFO).map(k=>{
    const info=INFRA_INFO[k], streak=g.infra?.[k]||0, pct=Math.round(Math.min(1,infraRatios[k].ratio)*100);
    const critical = streak>=3;
    const cost = infraFixCost(k, g);
    let statusHtml;
    if(infraGrace && pct<100) statusHtml = `<div style="font-size:10.5px;color:var(--gold2);">🕊️ کمبود دارید اما در دوره معافیت — هنوز مجازاتی اعمال نمی‌شود</div>`;
    else if(critical) statusHtml = `<div style="font-size:10.5px;color:var(--crimson);">⚠️ کمبود ساختاری (${streak} نوبت متوالی) — تولید و محبوبیت را کاهش می‌دهد</div>`;
    else statusHtml = `<div style="font-size:10.5px;color:var(--muted);">وضعیت پایدار</div>`;
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;${critical?'':''}">
      <div style="font-size:18px;">${info.ic}</div>
      <div style="flex:1;">
        <div style="font-size:12.5px;font-weight:700;">${info.name} — ${pct}٪ تامین</div>
        ${statusHtml}
      </div>
      ${critical && !infraGrace?`<button class="a-btn cr" ${!canAfford(cost)?'disabled':''} onclick="investInfrastructure('${k}')">${info.fixName}<br>💰${fmt(cost.money)}</button>`:''}
    </div>`;
  }).join('');
  const criticalCount = Object.keys(INFRA_INFO).filter(k=>(g.infra?.[k]||0)>=4).length;
  const cascadeNote = criticalCount>=2 ? `<p style="font-size:10.5px;color:var(--crimson);text-align:center;margin:4px 0 0;">🌐 بحران زنجیره‌ای فعال است: کمبودها به هم دامن می‌زنند (برق ضعیف تولید نفت/فولاد را کم می‌کند، نفت ضعیف ظرفیت نیروگاه را کم می‌کند، آب ضعیف تولید غذا را کم می‌کند) — رفع سریع‌ترین مورد، فشار روی بقیه را هم کم می‌کند.</p>` : '';
  const inGrace = infraInGrace(g);
  const graceNote = inGrace ? `<p style="font-size:11px;color:var(--gold2);text-align:center;background:var(--gold-dim);border-radius:var(--radius-sm);padding:8px 10px;margin:0 0 8px;">🕊️ دوره معافیت زیرساخت فعال است — ${fmt(infraGraceTurnsLeft(g))} روز باقی مانده تا کمبود نفت/برق/آب مجازات‌دار شود. از این فرصت برای ساخت دکل نفت، نیروگاه و تصفیه‌خانه استفاده کنید.</p>` : '';

  return `
  <div class="sec">📦 منابع کشور</div>
  <div class="res-grid">${resHtml}</div>

  <div class="sec">🚨 زیرساخت‌های حیاتی</div>
  ${graceNote}
  <div class="card">${infraCard}</div>
  ${cascadeNote}
  <p style="font-size:10.5px;color:var(--muted);text-align:center;margin:4px 0 0;">ساخت دکل نفت، نیروگاه و تصفیه‌خانه، تامین را پایدار نگه می‌دارد؛ اقدام اضطراری هزینه بیشتری دارد اما فوری کمبود را جبران می‌کند.</p>

  <div class="sec">🧳 گردشگری</div>
  <div class="res-grid" style="grid-template-columns:repeat(2,1fr);">
    <div class="res"><div class="ic">🧳</div><div class="v">${fmt(g.tourists||0)}</div><div class="lb">توریست این نوبت</div></div>
    <div class="res"><div class="ic">🏨</div><div class="v">${(g.buildings.hotel||0)+(g.buildings.attraction||0)}</div><div class="lb">هتل و جاذبه</div></div>
  </div>
  <p style="font-size:11px;color:var(--muted);text-align:center;margin:4px 0 0;">درآمد گردشگری به محبوبیت شما و ثبات روابط بین‌المللی وابسته است</p>

  <div class="sec">💵 نرخ مالیات</div>
  <div class="seg">
    <button class="${g.taxRate===0.7?'on':''}" onclick="g.taxRate=0.7;saveGame();render()">کاهش</button>
    <button class="${g.taxRate===1?'on':''}" onclick="g.taxRate=1;saveGame();render()">عادی</button>
    <button class="${g.taxRate===1.35?'on':''}" onclick="g.taxRate=1.35;saveGame();render()">افزایش</button>
    <button class="${g.taxRate===1.7?'on':''}" onclick="g.taxRate=1.7;saveGame();render()">فشار حداکثری</button>
  </div>
  <p style="font-size:11px;color:var(--muted);text-align:center;margin:6px 0 0;">وصولی فعلی: <b>${Math.round(taxCompliance(g)*100)}٪</b> از پایه مالیاتی — نرخ خیلی بالا باعث فرار مالیاتی می‌شود و لزوماً درآمد بیشتری نمی‌دهد؛ محبوبیت پایین و ناآرامی هم وصولی را کاهش می‌دهند.</p>

  <div class="sec">🏗️ زیرساخت و تولید</div>
  ${builds}

  <div class="sec">🏦 خزانه‌داری</div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:13px;">
      <span style="color:var(--muted)">بدهی</span><b>${fmt(g.debt)}</b>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="a-btn" style="flex:1;" onclick="takeLoan()">وام (+۲۵٬۰۰۰)</button>
      <button class="a-btn gold" style="flex:1;" onclick="repayLoan()" ${g.debt<=0?'disabled':''}>بازپرداخت</button>
    </div>
  </div>`;
}

function renderMilitary(){
  const g=state.game;
  const groups = UNIT_GROUPS.map(grp=>`<div class="cat-label">${grp.label}</div>${grp.keys.map(unitCard).join('')}`).join('');

  const campaignsHtml = (g.campaigns||[]).map(campaignCard).join('');

  const targets = (g.militaryTargets||[]).map(id=>{
    const t = g.allCountries.find(c=>c.id===id);
    if(!t) return '';
    const rel = g.relations[id]||0;
    return `<div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <span style="font-size:22px;">${t.flag}</span>
        <div style="flex:1;"><b>${t.name}</b><div style="font-size:11px;color:var(--muted);">قدرت پایه: ${t.milBase}</div></div>
        ${relPill(rel)}
      </div>
      <button class="a-btn cr" style="width:100%;" onclick="openDeploy('${id}')">🚚 اعزام نیرو</button>
    </div>`;
  }).join('');

  const covertAtCap = totalCovertUnits(g) >= g.covertSlots;
  const covertSlotCostV = covertSlotCost(g);
  const covertSlotCostStr = Object.keys(covertSlotCostV).map(r=>`${RESOURCES[r]?.ic||''}${fmt(covertSlotCostV[r])}`).join(' ');
  const covertUnits = Object.keys(COVERT_UNITS).filter(k=>k!=='militiaCell').map(k=>{
    const info=COVERT_UNITS[k], cnt=g.covertUnits[k]||0;

  state.covertTarget = state.covertTarget || (g.militaryTargets && g.militaryTargets[0]);

    const op = COVERT_OPS[k];

  const ground = UNIT_GROUPS[0].keys.map(unitCard).join('');
  const air = UNIT_GROUPS[1].keys.map(unitCard).join('');
  const naval = UNIT_GROUPS[2].keys.map(unitCard).join('');

  const targetSec = militarySection('targets','🎯 اهداف نظامی',targetBody);
  const proxyCards = (g.proxyGroups||[]).map(pg=>{
    const t=g.allCountries.find(c=>c.id===pg.targetId);

      const op=PROXY_OPS[k], dis=(!canAfford(op.cost)||!t)?'disabled':'', costStr=Object.keys(op.cost).map(r=>(RESOURCES[r]?.ic||'')+fmt(op.cost[r])).join(' ');

  const proxy = militarySection('proxy','🎭 گروهک‌های نیابتی ('+(g.proxyGroups||[]).length+')',proxyBody+proxyNew);
  const covertBody = covertUnits+covertCapCard+'<div class="cat-label">🎯 هدف عملیات: '+(covertTargetC?covertTargetC.flag+' '+covertTargetC.name:'—')+'</div><div class="chips" style="margin-bottom:10px;">'+(g.militaryTargets||[]).map(id=>{const c=g.allCountries.find(x=>x.id===id);if(!c)return '';return '<button class="chip '+(state.covertTarget===id?'on':'')+'" onclick="state.covertTarget=\''+id+'\';render()">'+c.flag+' '+c.name+'</button>';}).join('')+'</div>'+covertOps;

function sendForeignAid(tid){ const g=state.game; const c=g.allCountries.find(x=>x.id===tid); if(!c||!canAfford({money:3500,food:8}))return; pay({money:3500,food:8}); g.relations[tid]=clamp((g.relations[tid]||0)+10,-100,100); g.res.influence+=2; addLog(`🤝 کمک خارجی به ${c.flag} ${c.name} ارسال شد؛ رابطه و نفوذ افزایش یافت.`); saveGame(); render(); }
function culturalExchange(tid){ const g=state.game; const c=g.allCountries.find(x=>x.id===tid); if(!c||!canAfford({money:1800}))return; pay({money:1800}); g.relations[tid]=clamp((g.relations[tid]||0)+6,-100,100); g.approval=clamp(g.approval+1); addLog(`🎭 تبادل فرهنگی با ${c.flag} ${c.name} انجام شد.`); saveGame(); render(); }
function intelligencePact(tid){ const g=state.game; const c=g.allCountries.find(x=>x.id===tid); if(!c||!canAfford({money:4200,tech:3})||(g.relations[tid]||0)<30)return; pay({money:4200,tech:3}); if(!g.intelPacts)g.intelPacts=[]; if(!g.intelPacts.includes(tid))g.intelPacts.push(tid); g.res.influence+=3; addLog(`🛰️ پیمان اطلاعاتی با ${c.flag} ${c.name} برقرار شد.`); saveGame(); render(); }

  return `

function companyRankScore(co){
  const revenue = Number(co.totalRevenue||0);
  return Math.max(1, Math.round((co.capacity||0)*8 + (co.factories||1)*120 + (co.employees||0)*2 + (co.quality||0)*2 + (co.reputation||0)*2 + Math.log10(revenue+10)*35 + (co.cash||0)/1200));
}

    name:co.name, country:g.countryName, flag:g.flag, sector:co.sector, score:companyRankScore(co), player:true
  }));

function renderRank(){
  const g=state.game;
  const scored = g.allCountries.map(c=>{
    const isMe = c.id===g.countryId;
    const isConq = g.conquered.includes(c.id);
    const isPuppet = (g.puppets||[]).includes(c.id);
    let score = c.milBase + c.money/2000 + c.pop*2;
    if(isMe) score = milPower() + g.res.money/2000 + g.pop*2 + territoryScore()*80;
    if(isConq) score *= 0.3; else if(isPuppet) score *= 0.7;
    return {...c, score:Math.round(score), isMe, isConq, isPuppet};
  }).sort((a,b)=>b.score-a.score);
  return `
  <div class="sec">🏆 رتبه‌بندی قدرت جهانی کشورها</div>
  <div class="card" style="padding:8px 12px;">
    ${scored.map((c,i)=>`<div class="rank-item" onclick="openCountry('${c.id}')" style="cursor:pointer;">

  ${renderCompanyRanking()}`;
}

// Real-time tick: completes car R&D research (3-minute timers) even without ending a turn,
// and live-updates the countdown shown in the R&D modal without a full re-render (so typing
// in the "new model name" field never gets reset).
setInterval(()=>{
  if(!state.game || !state.game.companies) return;
  let changed = false;
  state.game.companies.forEach(co=>{
    ensureCarResearch(co);
    if(co.research.active && Date.now()>=co.research.active.completesAt){
      checkCompanyResearch(co);
      changed = true;
    }
  });
  if(changed){
    const nameEl = document.getElementById('carNameInput');
    const savedName = nameEl ? nameEl.value : null;
    saveGame();
    render();
    if(savedName!==null){ const el2=document.getElementById('carNameInput'); if(el2) el2.value = savedName; }
    return;
  }
  if(state.modal && state.modal.type==='carLab'){
    const co = state.game.companies.find(c=>c.id===state.modal.id);
    if(co && co.research && co.research.active){
      const el = document.getElementById('rndCountdown');
      if(el) el.textContent = formatCountdown(co.research.active.completesAt - Date.now());
    }
  }
}, 1000);

// WebView stability guard: show a friendly in-game error instead of a blank page.
window.addEventListener('error', function(e){
  try {
    const app=document.getElementById('app');
    if(app && !app.innerHTML.trim()) app.innerHTML='<div style=\"padding:30px;text-align:center;color:#fff\">خطایی در اجرای بازی رخ داد. لطفاً بازی را دوباره اجرا کنید.</div>';
  } catch(_) {}
});

// Init
render();
setTimeout(maybeShowStartupAd, 700);
</script>
</body>
</html>
