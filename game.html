<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Golden President — شبیه‌ساز سیاسی، اقتصادی و مدیریت شرکت. یک کشور را رهبری کنید، شرکت بسازید و در دیپلماسی و نظامی جهانی رقابت کنید.">
<title>Golden President | شبیه‌ساز ریاست‌جمهوری</title>
<style>
:root{
  --bg:#0b1220; --bg2:#0e1626; --panel:#141c2f; --panel2:#1b2540; --panel3:#212c48;
  --border:rgba(255,255,255,.09); --gold:#c9a227; --gold2:#e6c65c; --gold-dim:rgba(201,162,39,.18);
  --teal:#2fb8a6; --teal-dim:rgba(47,184,166,.16); --crimson:#c1443b; --crimson-dim:rgba(193,68,59,.16);
  --green:#4caf6e; --green-dim:rgba(76,175,110,.16); --yellow:#e0b44a; --yellow-dim:rgba(224,180,74,.16);
  --text:#edeff5; --muted:#8891a8; --muted2:#5f6883; --radius:14px; --radius-sm:10px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:pan-y;}
html{background:var(--bg);}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}
@media (orientation:landscape){body{overflow-x:hidden;} #app{width:min(100%,430px);}}
body{
  background:radial-gradient(ellipse at 15% -5%,rgba(201,162,39,.07),transparent 42%),
             radial-gradient(ellipse at 95% 5%,rgba(47,184,166,.05),transparent 38%), var(--bg);
  color:var(--text); font-family:system-ui,'Noto Sans Arabic','Noto Sans',Tahoma,sans-serif; min-height:100vh;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
#app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

/* Portrait-first mobile game layout */
@media (orientation:landscape){#app{max-width:430px;min-width:0;margin:0 auto;}}
#rotateHint{display:none;position:fixed;inset:0;z-index:1000;background:rgba(5,9,17,.96);align-items:center;justify-content:center;text-align:center;padding:24px;}
#rotateHint .rh-card{max-width:330px;background:var(--panel);border:1px solid var(--gold-dim);border-radius:22px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
#rotateHint .rh-icon{font-size:54px;margin-bottom:12px;animation:rotatePhone 1.5s ease-in-out infinite alternate;}
@keyframes rotatePhone{from{transform:rotate(0deg)}to{transform:rotate(90deg)}}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}

/* Game header / manual save */
.g-header{position:sticky;top:0;z-index:30;padding-top:44px;}
.g-header .h-row{padding-right:54px;}
.save-game-btn{position:absolute;top:10px;right:12px;z-index:35;display:flex;align-items:center;justify-content:center;gap:5px;
  min-width:42px;height:36px;padding:0 10px;border-radius:10px;background:var(--gold-dim);color:var(--gold2);
  border:1px solid rgba(201,162,39,.55);font-size:12px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.18);
  transition:transform .1s,background .15s;}
.save-game-btn:active{transform:scale(.96);background:rgba(201,162,39,.28);}
.save-game-btn .save-label{display:inline;}

@media (max-width:680px){
  .g-header .h-row{padding-right:58px;}
  .save-game-btn{right:10px;top:9px;height:35px;min-width:40px;padding:0 9px;}
  .save-game-btn .save-label{display:none;}
}

input,select{font-family:inherit;}
::selection{background:var(--gold-dim);}

.m-accordion{margin:8px 0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.015);}
.m-acc-head{width:100%;padding:12px 14px;background:var(--panel);color:var(--text);display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;}
.m-acc-body{padding:6px 10px 10px;background:var(--bg2);}
.mil-summary{font-size:10.5px;color:var(--muted);padding:7px 10px;text-align:center;background:var(--panel2);border-radius:10px;}
.message-request{border:1px solid var(--gold-dim);background:linear-gradient(135deg,var(--panel2),var(--panel));}
.msg-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}

/* Common */
.seal{border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.06),transparent 60%),
             conic-gradient(from 0deg,var(--gold),var(--gold2),var(--gold));
  box-shadow:0 0 0 3px rgba(11,18,32,.9),0 0 0 4px var(--gold-dim),0 8px 24px rgba(0,0,0,.4);position:relative;}
.seal::before{content:'';position:absolute;inset:8%;border-radius:50%;background:var(--bg);border:1.5px dashed rgba(201,162,39,.5);}
.seal .si{position:relative;z-index:1;}
.seal.lg{width:100px;height:100px;} .seal.lg .si{font-size:40px;}
.seal.sm{width:42px;height:42px;flex-shrink:0;} .seal.sm .si{font-size:18px;}

.btn{padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .1s;}
.btn:active{transform:scale(.97);}
.btn-gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#20180a;box-shadow:0 6px 18px rgba(201,162,39,.28);}
.btn-ghost{background:var(--panel);color:var(--text);border:1px solid var(--border);}
.btn-teal{background:var(--teal-dim);color:#6fd6c8;border:1px solid var(--teal);}
.btn-crimson{background:var(--crimson-dim);color:#e5847c;border:1px solid var(--crimson);}
.btn:disabled{opacity:.35;pointer-events:none;}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;}
.pill-g{background:var(--green-dim);color:#8bd7a2;}
.pill-y{background:var(--yellow-dim);color:#f0d078;}
.pill-r{background:var(--crimson-dim);color:#e5847c;}
.pill-gold{background:var(--gold-dim);color:var(--gold2);}

/* Screens */
.screen{flex:1;display:flex;flex-direction:column;padding:20px 16px;padding-bottom:90px;}
.start-screen{align-items:center;justify-content:center;text-align:center;gap:14px;
  background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:20px 20px;}
.eyebrow{letter-spacing:1.5px;font-size:11px;color:var(--gold2);font-weight:700;}
.title-xl{font-size:28px;font-weight:900;margin:0;line-height:1.3;
  background:linear-gradient(90deg,var(--gold2),#fff 45%,var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{color:var(--muted);font-size:13.5px;max-width:360px;line-height:1.85;margin:0;}
.ver{font-size:11px;color:var(--muted2);}

.scenario-grid{display:grid;grid-template-columns:1fr;gap:10px;width:100%;max-width:360px;margin-top:8px;}
.sc-card{background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;text-align:right;transition:border-color .15s,background .15s;}
.sc-card:active,.sc-card.active{border-color:var(--gold);background:var(--gold-dim);}
.sc-card h3{margin:0 0 4px;font-size:15px;font-weight:800;}
.sc-card p{margin:0;font-size:12px;color:var(--muted);line-height:1.6;}

/* Select country */
.select-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.select-header h2{font-size:17px;margin:0;font-weight:800;}
.select-header p{margin:2px 0 0;color:var(--muted);font-size:12px;}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--panel);color:var(--muted);border:1px solid var(--border);}
.chip.on{background:var(--gold-dim);color:var(--gold2);border-color:var(--gold);}
.country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;}
.c-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 8px;text-align:center;transition:background .12s;}
.c-card:active{background:var(--panel3);}
.c-card{cursor:pointer;}

.c-flag{font-size:28px;line-height:1;margin-bottom:6px;}
.c-name{font-size:12.5px;font-weight:700;margin-bottom:4px;}
.tier{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;}
.tS{background:var(--crimson-dim);color:#e5847c;} .tA{background:var(--gold-dim);color:var(--gold2);}
.tB{background:var(--teal-dim);color:#6fd6c8;} .tC{background:var(--green-dim);color:#8bd7a2;}

/* Game header */
.g-header{position:sticky;top:0;z-index:30;padding-top:44px;background:rgba(11,18,32,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:12px 14px 8px;}
.h-row{display:flex;align-items:center;gap:8px;}
.h-flag{font-size:24px;}
.h-titles{flex:1;min-width:0;}
.h-titles .cn{font-size:14px;font-weight:800;}
.h-titles .pr{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.h-turn{text-align:left;font-size:10.5px;color:var(--muted);}
.h-turn b{color:var(--gold2);font-size:13px;display:block;}

/* Main menu */
.menu-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-top:14px;}
.menu-btn{padding:14px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:14px;font-weight:700;text-align:right;transition:transform .1s,background .15s;}
.menu-btn:active{transform:scale(.97);}
.menu-btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#20180a;box-shadow:0 6px 18px rgba(201,162,39,.28);border:none;}

/* Settings / difficulty */
.diff-list{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:8px;}
.diff-card{display:flex;align-items:center;gap:12px;background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px;text-align:right;width:100%;}
.diff-card.on{border-color:var(--gold);background:var(--gold-dim);}
.diff-card .dc-ic{font-size:22px;flex-shrink:0;}
.diff-card .dc-main{flex:1;}
.diff-card .dc-name{font-size:14px;font-weight:800;}
.diff-card .dc-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.6;}
.diff-card .dc-check{color:var(--gold2);font-weight:900;font-size:16px;}

/* Load slots */
.slot-card{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;}
.slot-card.empty{opacity:.55;}
.slot-card .slot-ic{font-size:26px;flex-shrink:0;}
.slot-card .slot-main{flex:1;font-size:12.5px;color:var(--muted);}
.slot-card .slot-main b{display:block;font-size:13.5px;color:var(--text);margin-bottom:2px;}
.slot-card .slot-actions{display:flex;flex-direction:column;gap:6px;}
.slot-card .slot-actions button{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;}
.stats{display:flex;flex-wrap:nowrap;gap:5px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;}
.stats::-webkit-scrollbar{display:none;}
.sp{flex:0 0 auto;min-width:56px;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:5px 8px;text-align:center;}
.sp .ic{font-size:11px;} .sp .v{font-size:11.5px;font-weight:800;margin-top:1px;}
.sp .lb{font-size:8.5px;color:var(--muted);margin-top:1px;}
.sp.warn .v{color:#e5847c;}
.tabs{display:flex;gap:4px;padding:8px 14px 0;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1;min-width:64px;padding:8px 4px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;
  background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.on{color:var(--text);border-bottom-color:var(--gold);}

.content{padding:14px;padding-bottom:138px;flex:1;}
@media (max-width:680px){.content{padding-bottom:150px;}}
.sec{font-size:12.5px;font-weight:800;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:6px;}
.sec:first-child{margin-top:0;}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;}
.a-card{display:flex;align-items:center;gap:10px;}
.a-ic{font-size:22px;width:36px;text-align:center;flex-shrink:0;}
.a-main{flex:1;min-width:0;}
.a-name{font-size:13.5px;font-weight:700;}
.a-meta{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.55;}
.a-cnt{display:inline-block;background:var(--panel2);color:var(--gold2);font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;margin-left:4px;}
.a-btn{padding:8px 12px;border-radius:999px;font-size:11.5px;font-weight:700;flex-shrink:0;white-space:nowrap;border:1px solid var(--border);background:var(--panel2);color:var(--text);}
.a-btn.gold{background:var(--gold-dim);color:var(--gold2);border-color:var(--gold);}
.a-btn.cr{background:var(--crimson-dim);color:#e5847c;border-color:var(--crimson);}
.a-btn.tl{background:var(--teal-dim);color:#6fd6c8;border-color:var(--teal);}
.a-btn:disabled{opacity:.35;}

.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
.res{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;text-align:center;}
.res .ic{font-size:16px;} .res .v{font-size:13px;font-weight:800;margin-top:2px;}
.res .lb{font-size:9.5px;color:var(--muted);}

.seg{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:3px;margin-bottom:12px;}
.seg button{flex:1;padding:7px 4px;border-radius:999px;font-size:11.5px;font-weight:700;color:var(--muted);background:transparent;}
.seg button.on{background:var(--gold-dim);color:var(--gold2);}

/* Map */
.map-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:12px;}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:4px;}
.m-cell{aspect-ratio:1;border-radius:8px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:18px;border:2px solid transparent;position:relative;padding:2px;}
.m-cell.me{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-dim);}
.m-cell.ally{border-color:var(--green);}
.m-cell.enemy{border-color:var(--crimson);}
.m-cell.neutral{border-color:var(--yellow);}
.m-cell .mn{font-size:8px;color:var(--muted);margin-top:1px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:10.5px;color:var(--muted);}
.legend span{display:flex;align-items:center;gap:4px;}
.real-map{display:none;}
.map-stats{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.mstat{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--panel2);}
.mstat.gold{color:var(--gold2);} .mstat.green{color:#8bd7a2;} .mstat.red{color:#e5847c;}
.m-cell{position:relative;padding-bottom:14px;}
.m-cell .mflag{font-size:20px;}
.mbar{position:absolute;bottom:4px;left:8px;right:8px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;}
.mbar-fill{height:100%;background:linear-gradient(90deg,var(--crimson),var(--yellow),var(--green));}

/* Market */
.item-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.item-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;}
.item-card .ii{font-size:20px;} .item-card .iname{font-size:12px;font-weight:700;margin-top:2px;}
.item-card .iqty{font-size:11px;color:var(--muted);} .item-card .iprice{font-size:11px;color:var(--gold2);font-weight:700;}
.item-card .iprice.up{color:#8bd7a2;} .item-card .iprice.down{color:#e5847c;}
.item-card button{width:100%;margin-top:6px;padding:6px;border-radius:8px;background:var(--gold-dim);color:var(--gold2);font-size:11px;font-weight:700;}
.item-card button:disabled{opacity:.3;}
.item-card button.buy-btn{background:var(--teal-dim);color:#6fd6c8;}
.cat-label{font-size:11px;color:var(--muted2);margin:10px 0 4px;font-weight:700;}

/* Companies */
.co-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.co-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.co-head .ic{font-size:24px;} .co-head h4{margin:0;font-size:14px;} .co-head p{margin:0;font-size:11px;color:var(--muted);}
.co-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
.co-stats .cs{background:var(--panel2);border-radius:8px;padding:6px;text-align:center;}
.co-stats .cs .v{font-size:12px;font-weight:800;} .co-stats .cs .l{font-size:9px;color:var(--muted);}
.co-actions{display:flex;gap:6px;flex-wrap:wrap;}
.co-actions button{flex:1;min-width:78px;padding:7px;border-radius:8px;font-size:10.5px;font-weight:700;background:var(--panel2);color:var(--text);border:1px solid var(--border);}
.co-actions button.gold{background:var(--gold-dim);color:var(--gold2);border-color:var(--gold);}
.co-actions button:disabled{opacity:.35;}
.sector-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.rival-bar{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);margin-bottom:5px;}
.rival-bar span{width:78px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rb-track{flex:1;height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;}
.rb-fill{height:100%;background:var(--crimson);border-radius:4px;}
.rival-bar b{width:34px;text-align:left;color:var(--text);}
.sector-pick{background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 4px;text-align:center;font-size:11px;font-weight:700;}
.sector-pick.on{border-color:var(--gold);background:var(--gold-dim);color:var(--gold2);}
.sector-pick .ic{font-size:22px;display:block;margin-bottom:2px;}
.co-name-input{width:100%;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:13px;margin-bottom:10px;}

/* News */
.news-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;}
.news-card .ic{font-size:18px;} .news-card .txt{font-size:12.5px;line-height:1.6;} .news-card .meta{font-size:10px;color:var(--muted2);margin-top:2px;}
.dot{width:8px;height:8px;border-radius:50%;}

/* Ranking */
.rank-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
.rank-item:last-child{border-bottom:none;}
.rank-n{width:22px;font-size:12px;font-weight:800;color:var(--gold2);text-align:center;}
.rank-flag{font-size:20px;}
.rank-name{flex:1;font-size:13px;font-weight:600;}
.rank-val{font-size:12px;color:var(--muted);font-weight:700;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(6,9,16,.9);z-index:80;display:flex;align-items:flex-end;justify-content:center;
  padding:0;backdrop-filter:blur(5px);}
.modal{background:var(--panel);border:1px solid var(--gold-dim);border-radius:20px 20px 0 0;padding:20px 16px 28px;
  max-width:680px;width:100%;max-height:85vh;overflow-y:auto;}
.modal-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.modal-h h3{margin:0;font-size:16px;font-weight:800;flex:1;}
.close-btn{background:var(--panel2);border:1px solid var(--border);width:32px;height:32px;border-radius:50%;
  color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center;}
.pres-card{display:flex;gap:12px;align-items:center;background:var(--panel2);border-radius:var(--radius-sm);padding:12px;margin-bottom:12px;}

// ================== GEOGRAPHY: REALISTIC RESOURCES & SHIPPING ==================
// Not every country can produce every commodity at home — climate and geology
// decide that. Anything not listed as restricted below (grain, orchard fruit,
// fish, water treatment, livestock) is assumed buildable almost everywhere.
const GEO_ALLOWED = {
  // tropical fruit (coconut/banana/pineapple) needs an equatorial/tropical climate
  tropical:  ['br','id','my','ph','th','vn','ng','ke','co','mx','in'],
  // metal ores need real mineral deposits
  ironMine:  ['us','cn','ru','in','br','au','za','ua','ca','se','tr','mx','ir'],
  goldMine:  ['cn','ru','au','us','ca','za','br','id','mx','ph','ke'],
  coalMine:  ['cn','in','us','au','ru','id','za','pl','de','tr','ua'],
  copperMine:['cl','cn','us','au','ru','mx','co','id','pl','za'],
  // natural gas fields — same real-world producers as crude oil below
  gasField:  ['us','ru','sa','ir','ca','cn','ng','eg','mx'],
  // spices (pepper/turmeric/saffron) need the right growing regions
  spiceFarm: ['in','ir','th','vn','id','my','ma','tr','ke']
};
// Crude oil (the core "oil" resource, from an oil rig) — no European country
// in this game has domestic reserves; only these countries do.
const OIL_ALLOWED = ['us','ru','sa','ir','ca','cn','mx','ng','co','eg'];
// Landlocked countries have no coastline — sea shipping is impossible for them,
// and they can't build a fishing port either.
const LANDLOCKED = ['ch','at'];
// Island / archipelago nations with no land border to any neighbor — overland
// shipping is impossible for them, sea and air only.
const NO_LAND_BORDER = ['gb','jp','au','nz','ph','id'];

const COASTAL = ['us','cn','ru','jp','gb','fr','de','it','es','pt','nl','no','se','fi','dk','gr','tr','in','br','kr','ca','au','nz','id','ph','th','vn','my','eg','sa','ir','mx','ar','cl','co','za','ng','ma','ke'];
const LAND_NEIGHBORS = {
  us:['ca','mx'], ca:['us'], mx:['us','ar'], br:['ar','cl','co','pe'], ar:['cl','br'], cl:['ar','pe'], co:['br','mx'],
  de:['fr','pl','nl','be','at','dk'], fr:['de','es','it','be','ch'], es:['pt','fr'], pt:['es'], it:['fr','ch','at'],
  nl:['de','be'], be:['fr','de','nl'], ch:['fr','de','it','at'], at:['de','it','ch'], pl:['de','ua'], ua:['pl','ru'],
  ru:['ua','cn','fi','no'], no:['se','fi','ru'], se:['no','fi','dk'], fi:['se','ru'], dk:['de'],
  tr:['gr','ru','ir'], gr:['tr'], ir:['tr','pk'], pk:['ir','in'], in:['pk','cn'], cn:['ru','in','kr','vn'], kr:['cn'],
  vn:['cn','th'], th:['vn','my'], my:['th'], id:[], jp:[], gb:[], au:[], nz:[], ph:[],
  eg:['sa','ly'], sa:['eg','ir'], za:[], ng:[], ma:[], ke:[]
};
function hasLandRoute(a,b){ return !!((LAND_NEIGHBORS[a]||[]).includes(b) || (LAND_NEIGHBORS[b]||[]).includes(a)); }
function hasSeaAccess(id){ return COASTAL.includes(id); }
function routeAllowed(origin,dest,mode){
  if(mode==='air') return true;
  if(mode==='sea') return hasSeaAccess(origin) && hasSeaAccess(dest);
  if(mode==='land') return hasLandRoute(origin,dest);
  return false;
}
function availableTransportModesForRoute(origin,dest){ return ['air','sea','land'].filter(m=>routeAllowed(origin,dest,m)); }

function canBuildItemBuilding(countryId, key){
  if(key==='fishPort') return !LANDLOCKED.includes(countryId);
  if(GEO_ALLOWED[key]) return GEO_ALLOWED[key].includes(countryId);
  return true; // cropland, orchard, waterPlant, ranch — broadly available everywhere
}
function canBuildCoreBuilding(countryId, key){
  if(key==='oilRig') return OIL_ALLOWED.includes(countryId);
  if(key==='port') return hasSeaAccess(countryId);
  return true;
}
function geoRestrictionNote(key){
  if(key==='fishPort' || key==='port') return 'کشور محصور در خشکی — دسترسی به دریا ندارد';
  if(key==='oilRig') return 'کشور شما ذخایر نفتی ندارد — نفت باید وارد شود';
  if(GEO_ALLOWED[key]) return 'اقلیم/منابع زمین‌شناسی کشور شما امکان تولید داخلی این کالا را نمی‌دهد — باید وارد شود';
  return '';
}

}

function genericTree(sector){return GENERIC_RESEARCH_TREES[sector]||[];}
function ensureGenericResearch(co){if(!co.research)co.research={unlocked:{},active:null}; if(!co.products)co.products=[];}
function openGenericLab(coId,view){state.modal={type:'genericLab',id:coId,view:view||'tree'};render();}
function startGenericResearch(coId,catKey,optId){const g=state.game,co=g.companies.find(c=>c.id===coId);if(!co)return;ensureGenericResearch(co);if(co.research.active)return;const cat=genericTree(co.sector).find(x=>x.key===catKey),o=cat&&cat.options.find(x=>x[0]===optId);if(!o)return;const cost={money:4000+(o[3]*350),tech:o[3]};if(!canAfford(cost))return;pay(cost);co.research.active={system:'generic',catKey,optId,startedAt:Date.now(),completesAt:Date.now()+CAR_RESEARCH_TIME_MS};saveGame();render();}
function renderGenericTree(co){ensureGenericResearch(co);let h='';const a=co.research.active;if(a&&a.system==='generic'){const c=genericTree(co.sector).find(x=>x.key===a.catKey),o=c&&c.options.find(x=>x[0]===a.optId);if(o)h+=`<div class="card" style="text-align:center;margin-bottom:10px;padding:12px;"><b>🔬 در حال تحقیق: ${o[2]} ${o[1]}</b><div style="font-size:22px;color:var(--gold2);margin-top:5px;">${formatCountdown(a.completesAt-Date.now())}</div></div>`;}genericTree(co.sector).forEach(c=>{const un=co.research.unlocked[c.key]||[];h+=`<div class="sec">${c.name}</div><div class="chips" style="flex-wrap:wrap;overflow:visible;">`;c.options.forEach(o=>{const ok=un.includes(o[0]),active=a&&a.system==='generic'&&a.catKey===c.key&&a.optId===o[0];if(ok)h+=`<span class="chip on">${o[2]} ${o[1]} ✓</span>`;else{const dis=!!a||!canAfford({money:4000+o[3]*350,tech:o[3]});h+=`<button class="chip" ${dis?'disabled':''} onclick="startGenericResearch('${co.id}','${c.key}','${o[0]}')">${o[2]} ${o[1]} · 💰${fmt(4000+o[3]*350)} 🔬${o[3]}${active?' ⏳':''}</button>`;}});h+='</div>';});return h;}
function createGenericProduct(coId){const g=state.game,co=g.companies.find(c=>c.id===coId);if(!co)return;ensureGenericResearch(co);const name=prompt('نام محصول را وارد کنید:');if(!name||!name.trim())return;const unlocked=Object.values(co.research.unlocked).flat();if(!unlocked.length){alert('ابتدا حداقل یک فناوری را تحقیق کنید.');return;}const product={id:'gp'+Date.now(),name:name.trim().slice(0,28),active:true,stock:Math.max(10,Math.floor(co.capacity)),totalSold:0,rating:Math.min(10,5+unlocked.length*0.4)};co.products.push(product);addLog(`🏭 «${co.name}» محصول جدید «${product.name}» را به تولید رساند.`);saveGame();render();}
function renderGenericProducts(co){ensureGenericResearch(co);return `<button class="btn btn-gold" style="width:100%;margin-bottom:8px;" onclick="createGenericProduct('${co.id}')">➕ تولید محصول جدید</button>`+(co.products.length?co.products.map(p=>`<div class="card" style="margin-bottom:7px;"><div style="display:flex;justify-content:space-between;"><b>📦 ${p.name}</b><span>⭐ ${p.rating.toFixed(1)}</span></div><div style="font-size:11px;color:var(--muted);margin-top:5px;">موجودی: ${fmt(p.stock)} · فروش کل: ${fmt(p.totalSold||0)}</div></div>`).join(''):'<p style="font-size:11.5px;color:var(--muted);text-align:center;padding:10px;">هنوز محصولی تولید نشده است.</p>');}

// Cost/outcome tuning per response, scaled by severity (0..1, higher = worse starting state)
function crisisResponseOutcome(crisis, choice, g){
  const severity = clamp(0.4 + (100-g.approval)/160, 0.3, 1.1);
  if(choice==='suppress'){
    return {
      cost:{money: Math.round(2500 + severity*4000)},
      approvalDelta: Math.round(9 + severity*4),      // fast fix
      unrestDelta: Math.round(6 + severity*8),         // but breeds resentment
      relationsHit: 0,
      log:`🛡️ نیروهای امنیتی «${crisis.name}» را با قدرت سرکوب کردند؛ آرامش فوری برقرار شد اما نارضایتی پنهان بالا رفت.`
    };
  }
  return {
    cost:{money: Math.round(5500 + severity*7000)},
    approvalDelta: Math.round(5 + severity*3),         // slower but healthier
    unrestDelta: -Math.round(4 + severity*3),
    relationsHit: 0,
    log:`🤝 دولت با گفتگو و کمک‌رسانی «${crisis.name}» را مدیریت کرد؛ اعتماد عمومی به‌آرامی بازگشت.`
  };
}
function resolveCrisis(choice){
  const g=state.game;
  const pc = g.pendingCrisis;
  if(!pc) return;
  const crisis = CRISES.find(c=>c.id===pc.id);
  if(!crisis) return;
  const outcome = crisisResponseOutcome(crisis, choice, g);
  if(canAfford(outcome.cost)) pay(outcome.cost);
  g.approval = clamp(g.approval + outcome.approvalDelta);
  g.unrestLevel = clamp((g.unrestLevel||0) + outcome.unrestDelta);
  addLog(`${crisis.ic} ${outcome.log}`);
  g.pendingCrisis = null;
  state.modal = null;
  saveGame(); render();
}

function triggerYearlyDisaster(g){
  const keys = Object.keys(YEARLY_DISASTERS);
  const key = keys[Math.floor(Math.random()*keys.length)];
  const type = YEARLY_DISASTERS[key];
  const sc = type.scenarios[Math.floor(Math.random()*type.scenarios.length)];
  if(key==='earthquake' || key==='flood' || key==='storm' || key==='wildfire'){
    return triggerManagedDisaster(g,key,sc.sev);
  }
  sc.apply(g);

  addLog(text);
  Object.keys(g.res).forEach(k=>{ if(g.res[k]<0) g.res[k]=0; });
  return text;
}


// ================== EXPANDED SIMULATION SYSTEM ==================
function ensureExpandedSystems(g){
  if(!g.companyExports) g.companyExports=[];
  if(!g.unResolutions) g.unResolutions=[];
  if(g.unActivity===undefined) g.unActivity=0;
  if(!g.smartEvent) g.smartEvent=null;
  if(!g.aiDiplomacyTick) g.aiDiplomacyTick=0;
  if(!g.aiTradeTick) g.aiTradeTick=0;
  if(!g.aiWarTick) g.aiWarTick=0;
}
function exportCompany(id){
  const g=state.game; ensureExpandedSystems(g);
  const co=g.companies.find(c=>c.id===id); if(!co)return;
  let qty=0, revenue=0, productName='محصولات';
  if((co.products||[]).length){
    const p=co.products.find(x=>(x.stock||0)>0 && x.active) || co.products.find(x=>x.active);
    if(!p)return;
    qty=Math.min(Math.max(1,Math.floor((p.stock||0)*0.35)), Math.max(1,Math.floor(co.capacity*0.25)));
    if((p.stock||0)<qty)return;
    p.stock-=qty; p.totalExported=(p.totalExported||0)+qty; productName=p.name||'محصول';
    revenue=Math.round(qty*p.price*0.82);
  }else{
    qty=Math.max(1,Math.floor(co.capacity*0.18));
    revenue=Math.round(qty*(sectorExportPrice(co.sector)));
    productName=(COMPANY_SECTORS[co.sector]?.tiers?.[co.tierIdx]?.name)||'محصول صنعتی';
  }
  g.res.money+=revenue;
  g.res.influence=clamp((g.res.influence||0)+0.4,0,100);
  co.reputation=clamp(co.reputation+0.8,5,100);
  co.cash+=Math.round(revenue*0.15);
  g.companyExports.unshift({turn:g.turn,company:co.name,product:productName,qty,revenue});
  if(g.companyExports.length>30)g.companyExports.pop();
  addLog(`🌍 صادرات «${productName}» توسط شرکت «${co.name}»: ${fmt(qty)} واحد و ${fmt(revenue)} درآمد ارزی.`);
  saveGame(); render();
}
function sectorExportPrice(k){ return ({car:180,phone:95,electronics:70,food:45,textile:38,energy:55}[k]||40); }
function aiCompanyExports(g){
  (g.companies||[]).forEach(co=>{ if(Math.random()<0.28 && co.capacity>0){ co.cash+=Math.round(co.capacity*sectorExportPrice(co.sector)*0.03); co.reputation=clamp(co.reputation+0.15,5,100); }});
}
function simulateLivingCountries(g){
  const cs=(g.allCountries||[]).filter(c=>c.id!==g.countryId); if(!cs.length)return;
  ensureExpandedSystems(g);
  cs.forEach(c=>{
    c.money=Number(c.money||50000); c.milBase=Number(c.milBase||50); c.tech=Number(c.tech||20); c.population=Number(c.population||c.pop||20);
    c.stability=clamp(Number(c.stability||55)+(Math.random()-0.48)*3,15,95);
    c.relationToWorld=clamp(Number(c.relationToWorld||50)+(Math.random()-0.5)*4,10,90);
    const growth=(0.003+Math.random()*0.009)*(c.stability/70);
    c.money=Math.round(c.money*(1+growth)); c.population*=1+growth*0.22; c.milBase=clamp(c.milBase*(1+growth*0.55)+(Math.random()-0.5)*1.5,10,600); c.tech+=Math.random()<0.2?1:0;
  });
  // AI-to-AI trade, pacts and tensions create a living world.
  if(Math.random()<0.45 && cs.length>=2){
    const a=cs[Math.floor(Math.random()*cs.length)], b=cs[Math.floor(Math.random()*cs.length)];
    if(a!==b){a.money+=900;b.money+=900; a.aiTrade=(a.aiTrade||0)+1; b.aiTrade=(b.aiTrade||0)+1; g.worldNews.unshift({turn:g.turn,year:g.year,text:`🤝 ${a.flag} ${a.name} و ${b.flag} ${b.name} قرارداد تجاری جدید بستند.`,icon:'🤝'});}
  }
  if(Math.random()<0.16 && cs.length>=2){
    const a=cs[Math.floor(Math.random()*cs.length)], b=cs[Math.floor(Math.random()*cs.length)];
    if(a!==b){ a.milBase=Math.min(600,a.milBase+3); b.milBase=Math.min(600,b.milBase+2); g.worldNews.unshift({turn:g.turn,year:g.year,text:`⚠️ ${a.flag} ${a.name} و ${b.flag} ${b.name} وارد رقابت امنیتی شدند.`,icon:'⚠️'}); }
  }
  if(Math.random()<0.08){
    const c=cs[Math.floor(Math.random()*cs.length)]; c.money+=4000; c.tech+=2; g.worldNews.unshift({turn:g.turn,year:g.year,text:`📈 ${c.flag} ${c.name} یک برنامه توسعه صنعتی جدید اجرا کرد.`,icon:'📈'});
  }
  if(g.worldNews.length>40)g.worldNews.splice(40);
}
function militaryOutcome(g,targetId){
  const t=g.allCountries.find(c=>c.id===targetId); if(!t)return null;
  const own=Math.max(1,milPower()); const enemy=Math.max(1,Number(t.milBase||50));
  const prep=1+(g.research?.military?.level||0)*0.025+(g.countryStatus?.energySecurity||0)/500;
  const defense=1+(Number(t.stability||55)/500);
  const ratio=(own*prep)/(enemy*defense);
  const roll=ratio*(0.88+Math.random()*0.3);
  if(roll>=1.18)return {result:'پیروزی',delta:-Math.round(enemy*0.28),ownDelta:Math.round(own*0.015),approval:2};
  if(roll<=0.82)return {result:'شکست',delta:-Math.round(enemy*0.08),ownDelta:-Math.round(own*0.18),approval:-5};
  return {result:'تساوی',delta:-Math.round(enemy*0.15),ownDelta:-Math.round(own*0.07),approval:-1};
}
function applyUNResolution(type,targetId){
  const g=state.game; ensureExpandedSystems(g); const t=g.allCountries.find(c=>c.id===targetId); if(!t)return;
  const cost={sanction:1200,aid:3500,peace:6000,investigation:2500}[type]||1500;
  if((g.res.money||0)<cost)return;
  g.res.money-=cost; g.unActivity++;
  if(type==='sanction'){t.money=Math.max(0,(t.money||0)-7000);t.milBase=Math.max(5,(t.milBase||50)-3);g.relations[targetId]=clamp((g.relations[targetId]||0)-7,-100,100);}
  if(type==='aid'){t.money=(t.money||0)+9000;t.stability=clamp((t.stability||50)+8,0,100);g.relations[targetId]=clamp((g.relations[targetId]||0)+8,-100,100);g.res.influence=clamp((g.res.influence||0)+3,0,100);}
  if(type==='peace'){t.milBase=Math.max(5,(t.milBase||50)-6);g.relations[targetId]=clamp((g.relations[targetId]||0)+10,-100,100);g.approval=clamp(g.approval+2);}
  if(type==='investigation'){t.stability=clamp((t.stability||50)-4,0,100);g.res.influence=clamp((g.res.influence||0)+2,0,100);}
  g.unResolutions.unshift({turn:g.turn,type,target:t.name}); if(g.unResolutions.length>20)g.unResolutions.pop();
  addLog(`🏛️ سازمان ملل: قطعنامه «${type==='sanction'?'تحریم':type==='aid'?'کمک بشردوستانه':type==='peace'?'آتش‌بس':'تحقیق بین‌المللی'}» علیه/برای ${t.flag} ${t.name} اجرا شد و اثر واقعی گذاشت.`);
  saveGame();render();
}

const MONTH_NAMES = ['ژانویه','فوریه','مارس','آوریل','مه','ژوئن','ژوئیه','اوت','سپتامبر','اکتبر','نوامبر','دسامبر'];
function isLeap(y){ return (y%4===0 && y%100!==0) || y%400===0; }
function daysInMonth(m,y){ const d=[31,isLeap(y)?29:28,31,30,31,30,31,31,30,31,30,31]; return d[m-1]; }
function advanceDate(g){
  g.date.day++;
  if(g.date.day > daysInMonth(g.date.month, g.date.year)){
    g.date.day = 1; g.date.month++;
    if(g.date.month>12){ g.date.month=1; g.date.year++; }
  }
  g.year = g.date.year;
  g.isDay = !g.isDay;
}
function fmtDate(g){
  return `${g.date.day} ${MONTH_NAMES[g.date.month-1]} ${g.date.year}`;
}

function getCountriesForScenario(scId){
  return BASE_COUNTRIES.filter(c=>{
    if(scId==='ww1' || scId==='ww2'){
      // hide some modern-only countries roughly
      if(['kr','id','pk','ng','ua','ke','my','vn'].includes(c.id) && scId==='ww1') return false;
      if(['kr','id','pk','ng','ua','ke'].includes(c.id) && scId==='ww2') return false;
    }
    return true;
  }).map(c=>{
    const mult = TIER_MULT[c.tier];
    const yearMult = scId==='current'?1 : scId==='ww2'?0.45 : 0.25;
    return {
      ...c,
      president: c.presidents[scId] || c.presidents.current || 'رهبر کشور',
      pop: Math.round( (c.tier==='S'?320:(c.tier==='A'?140:(c.tier==='B'?55:18))) * yearMult * 10)/10,
      money: Math.round( (c.tier==='S'?2600000:(c.tier==='A'?850000:(c.tier==='B'?260000:70000))) * yearMult ),
      milBase: Math.round( (c.tier==='S'?850:(c.tier==='A'?420:(c.tier==='B'?180:70))) * yearMult ),
      approval: c.tier==='S'?52 : c.tier==='A'?58 : c.tier==='B'?65 : 72
    };
  });
}

  // Relations: -100..100
  const relations = {};
  others.forEach(c=>{
    let base = Math.floor(Math.random()*60)-20; // -20..40
    if(state.scenario==='ww2'){
      // rough historical lean
      if(['de','it','jp'].includes(countryId) && ['de','it','jp'].includes(c.id)) base = 70;
      if(['us','gb','fr','ru'].includes(countryId) && ['us','gb','fr','ru'].includes(c.id)) base = 55;
      if(['de','it','jp'].includes(countryId) && ['us','gb','fr','ru'].includes(c.id)) base = -65;

      if(['de','at'].includes(countryId) && ['de','at'].includes(c.id)) base = 75;

    year: SCENARIOS[state.scenario].year,

    lastDisasterYear: SCENARIOS[state.scenario].year,
    isDay: true,

      steel: Math.round(me.milBase/12),
      goods: Math.round(me.pop*0.8),
      tech: Math.round( (me.tier==='S'?25:me.tier==='A'?12:me.tier==='B'?5:2) ),
      influence: Math.round(me.tier==='S'?15:me.tier==='A'?8:3)

    approval: me.approval,

    debt: 0,
    taxRate: 1,
    infra: {oil:0, power:0, water:0},
    countryStatus:{welfare:60,calm:60,influence:10,cleanAir:70,health:65,employment:60,energySecurity:50},
    research:{phone:{},laptop:{},textile:{},energy:{}},
    buildings: Object.fromEntries(Object.keys(BUILDINGS).map(k=>[k,0])),
    itemBuildings: Object.fromEntries(Object.keys(ITEM_BUILDINGS).map(k=>[k,0])),
    units: Object.fromEntries(Object.keys(UNITS).map(k=>[k,0])),
    items: Object.fromEntries(Object.keys(ITEMS).map(k=>[k,0])),
    marketPrices: Object.fromEntries(Object.keys(ITEMS).map(k=>[k,1])),
    companies: [],
    worldNews: [],
    lowApprovalStreak: 0,
    unrestLevel: 0,
    conquered: [],
    campaigns: [],
    shipments: [],
    messages: [],
    dailyRequest: null,

// Ensure older saves gain the new fields without breaking
function ensureGameDefaults(){
  const g = state.game;
  if(!g) return;
  if(!g.itemBuildings) g.itemBuildings = Object.fromEntries(Object.keys(ITEM_BUILDINGS).map(k=>[k,0]));
  if(!g.items) g.items = Object.fromEntries(Object.keys(ITEMS).map(k=>[k,0]));
  if(!g.marketPrices) g.marketPrices = Object.fromEntries(Object.keys(ITEMS).map(k=>[k,1]));
  if(!g.companies) g.companies = [];
  if(!g.worldNews) g.worldNews = [];
  if(!g.messages) g.messages = [];
  if(g.dailyRequest===undefined) g.dailyRequest = null;
  if(g.lowApprovalStreak===undefined) g.lowApprovalStreak = 0;
  if(g.unrestLevel===undefined) g.unrestLevel = 0;
  if(!g.date) g.date = {day:1, month:1, year:g.year||2026};
  if(g.startYear===undefined) g.startYear = g.date.year;
  if(g.isDay===undefined) g.isDay = true;
  if(!g.difficulty) g.difficulty = 'normal';
  if(!g.covertUnits) g.covertUnits = Object.fromEntries(Object.keys(COVERT_UNITS).map(k=>[k,0]));
  if(!g.countryStatus) g.countryStatus={welfare:60,calm:60,influence:10,cleanAir:70,health:65,employment:60,energySecurity:50};
  if(g.research===undefined) g.research={phone:{},laptop:{},textile:{},energy:{}};
  if(g.companySlots===undefined) g.companySlots = 3;
  if(g.covertSlots===undefined) g.covertSlots = 5;
  if(g.pendingCrisis===undefined) g.pendingCrisis = null;
  if(!g.campaigns) g.campaigns = [];
  if(!g.shipments) g.shipments = [];
  if(!g.pendingConquests) g.pendingConquests = [];
  if(!g.puppets) g.puppets = [];
  if(!g.alliances) g.alliances = [];
  if(!g.sanctions) g.sanctions = [];
  if(!g.militaryPacts) g.militaryPacts = [];
  if(!g.tradeDeals) g.tradeDeals = [];
  if(!g.intelPacts) g.intelPacts = [];
  if(g.lastHostileAttackYear===undefined) g.lastHostileAttackYear = null;
  if(g.pendingAttack===undefined) g.pendingAttack = null;
  if(g.lastDisasterYear===undefined) g.lastDisasterYear = g.date ? g.date.year : g.year;
  if(!g.store) g.store={owned:{no_ads:false,premium:false}, purchases:[], rewardedAds:0};
  if(!g.store.owned) g.store.owned={no_ads:false,premium:false};
  if(!Array.isArray(g.store.purchases)) g.store.purchases=[];
  if(g.store.rewardedAds===undefined) g.store.rewardedAds=0;
  if(!g.proxyGroups){
    g.proxyGroups = [];
    // Backfill old saves: turn any pre-existing generic militia count into named groups
    const oldCount = (g.covertUnits && g.covertUnits.militiaCell) || 0;
    if(oldCount>0){
      const pool = (g.militaryTargets && g.militaryTargets.length) ? g.militaryTargets : (g.diploTargets||[]);
      for(let i=0;i<oldCount;i++){
        const tid = pool.length ? pool[i%pool.length] : null;
        const t = tid ? g.allCountries.find(c=>c.id===tid) : null;
        g.proxyGroups.push({
          id:'pg'+Date.now()+Math.floor(Math.random()*1000)+i,
          name: generateProxyName(t?t.name:'ناشناخته'),
          targetId: tid,
          strength: Math.round(18+Math.random()*10),
          loyalty: Math.round(50+Math.random()*30),
          founded: g.turn
        });
      }
    }
  }
  if(g.tourists===undefined) g.tourists = Math.round((g.pop||10)*1.5);
  if(!g.infra) g.infra = {oil:0, power:0, water:0};
  // One-year grace period on the critical-infrastructure shortage system, so a
  // brand-new game gives the player time to build oil rigs / power plants /
  // water plants before shortages start hurting them. Saves that already existed
  // before this field was added are treated as already past their grace window.
  if(g.startTurn===undefined) g.startTurn = (g.turn<=1) ? g.turn : -99999;
  // Backfill any newly-added building / unit types on old saves
  Object.keys(BUILDINGS).forEach(k=>{ if(g.buildings[k]===undefined) g.buildings[k]=0; });
  Object.keys(UNITS).forEach(k=>{ if(g.units[k]===undefined) g.units[k]=0; });
  Object.keys(ITEM_BUILDINGS).forEach(k=>{ if(g.itemBuildings[k]===undefined) g.itemBuildings[k]=0; });
  Object.keys(ITEMS).forEach(k=>{ if(g.items[k]===undefined) g.items[k]=0; if(g.marketPrices[k]===undefined) g.marketPrices[k]=1; });
  g.companies.forEach(co=>{
    if(!co.unlockedTiers) co.unlockedTiers=[0];
    if(co.quality===undefined) co.quality=50;
    if(co.employees===undefined) co.employees=Math.round(co.capacity||8);
    if(co.factories===undefined) co.factories=1;
    if(co.stock===undefined) co.stock=0;
    if(!co.competitors) co.competitors = genCompetitors(co.sector);
    ensureCarResearch(co);
  });
}

function addLog(text){
  state.game.log.unshift({turn:state.game.turn, year:state.game.year, text});
  if(state.game.log.length>60) state.game.log.pop();
}

function milPower(){
  const g=state.game, u=g.units;
  let p = g.milBase*0.04;
  // Units currently away on a campaign don't defend the homeland
  Object.keys(UNITS).forEach(k=> p += Math.max(0,(u[k]||0)-deployedCount(k))*UNITS[k].power );
  p += (g.militaryPacts||[]).length * 15; // allied defensive support
  return Math.round(p);
}

function territoryScore(){ return 1 + state.game.conquered.length; }

// ---- Military campaigns: deployment takes time, resolution is multi-round attrition ----
function deployedCount(k){
  const g=state.game;
  if(!g || !g.campaigns) return 0;
  return g.campaigns.reduce((s,c)=> s + (c.units[k]||0), 0);
}
function availableUnits(k){
  return Math.max(0, (state.game.units[k]||0) - deployedCount(k));
}
function campaignOwnPower(c){
  return Object.keys(c.units).reduce((s,k)=> s + (c.units[k]||0)*(UNITS[k]?UNITS[k].power:0), 0);
}
function travelTurnsFor(target){
  return target.tier==='S'?4 : target.tier==='A'?3 : target.tier==='B'?2 : 1;
}

function openDeploy(tid){
  state.modal = {type:'deploy', id:tid};
  state.deployDraft = {targetId:tid, units:{}};
  render();
}
function incDeploy(k, delta){
  const d = state.deployDraft;
  if(!d) return;
  const max = availableUnits(k);
  const cur = d.units[k]||0;
  d.units[k] = Math.max(0, Math.min(max, cur+delta));
  render();
}
function confirmDeploy(){
  const d = state.deployDraft;
  if(!d) return;
  const g = state.game;
  const target = g.allCountries.find(c=>c.id===d.targetId);
  if(!target) return;
  const units = {};
  let power = 0;
  Object.keys(d.units).forEach(k=>{
    const q = d.units[k]||0;
    if(q>0){ units[k]=q; power += q*(UNITS[k]?UNITS[k].power:0); }
  });
  if(power<=0) return;
  const cost = Math.round(power*15);
  if(g.res.money < cost) return;
  g.res.money -= cost;
  const travel = travelTurnsFor(target);
  g.campaigns.push({
    id: 'camp_'+Date.now()+Math.floor(Math.random()*10000),
    targetId: target.id,
    targetName: target.name,
    targetFlag: target.flag,
    units,
    sentTurn: g.turn,
    travelTurns: travel,
    arriveTurn: g.turn + travel,
    status: 'traveling',
    targetPowerRemaining: target.milBase,
    targetPowerStart: target.milBase,
    rounds: 0
  });
  addLog(`🚚 نیرویی با قدرت ${power} به سمت ${target.flag} ${target.name} اعزام شد — تخمین رسیدن: ${travel} نوبت دیگر.`);
  state.modal = null; state.deployDraft = null;
  saveGame(); render();
}

function processCampaigns(g){
  if(!g.campaigns || !g.campaigns.length) return;
  const stillActive = [];
  g.campaigns.forEach(c=>{
    const target = g.allCountries.find(x=>x.id===c.targetId);
    if(!target) return; // target gone — campaign dissolves silently

    if(c.status==='traveling'){
      if(g.turn >= c.arriveTurn){
        c.status = 'engaged';
        addLog(`⚔️ نیروهای اعزامی به مرزهای ${target.flag} ${target.name} رسیدند و درگیری آغاز شد.`);
      }
      stillActive.push(c);
      return;
    }

    // Engaged: one round of grinding, attrition-based combat.
    // A small noise band (±4%) means the aggregate committed force decides
    // the fight — a single extra unit almost never flips the outcome.
    let ownPower = campaignOwnPower(c);
    if(ownPower<=0){
      addLog(`❌ نیروی اعزامی به ${target.flag} ${target.name} در میدان نبرد از بین رفت.`);
      g.approval = clamp(g.approval-4);
      return;
    }
    const enemyPower = Math.max(1, c.targetPowerRemaining);
    const ratio = ownPower/(ownPower+enemyPower);
    const noise = (Math.random()-0.5)*0.08;
    const effRatio = clamp(ratio+noise, 0.03, 0.97);
    const ownLossFrac = clamp(0.10 + (1-effRatio)*0.32, 0.05, 0.55);
    const enemyLossFrac = clamp(0.10 + effRatio*0.32, 0.05, 0.55);

    c.targetPowerRemaining = Math.max(0, c.targetPowerRemaining*(1-enemyLossFrac));
    Object.keys(c.units).forEach(k=>{
      const before = c.units[k]||0;
      const after = Math.max(0, Math.floor(before*(1-ownLossFrac)));
      const lost = before-after;
      if(lost>0) g.units[k] = Math.max(0, (g.units[k]||0)-lost);
      c.units[k] = after;
    });
    c.rounds++;
    ownPower = campaignOwnPower(c);

    // Every round of active combat has a visible knock-on effect — captured
    // supplies from the front, or an international reaction to the fighting.
    addLog(`⚔️ دور ${c.rounds} نبرد با ${target.flag} ${target.name}: قدرت دشمن ${Math.round((1-c.targetPowerRemaining/c.targetPowerStart)*100)}٪ کاهش یافت (تلفات شما: ${Math.round(ownLossFrac*100)}٪).`);
    if(Math.random()<0.4){
      const loot = Math.round(enemyLossFrac*400);
      g.res.steel += Math.round(loot/40);
      g.res.oil += Math.round(loot/60);
      g.res.money += loot*8;
      addLog(`📦 نیروهای شما در جریان نبرد تجهیزات و منابعی از ${target.flag} ${target.name} به‌غنیمت گرفتند.`);
    }
    if(Math.random()<0.3){
      g.res.influence = Math.max(0, g.res.influence-1);
      addLog(`🌐 افکار عمومی جهانی نسبت به درگیری با ${target.flag} ${target.name} واکنش نشان داد؛ نفوذ دیپلماتیک شما اندکی کاهش یافت.`);
    }

    const targetDefeated = c.targetPowerRemaining <= c.targetPowerStart*0.12;
    if(targetDefeated && ownPower>0){
      c.outcome='پیروزی';
      g.pendingConquests = g.pendingConquests || [];
      g.pendingConquests.push({
        targetId: target.id, targetName: target.name, targetFlag: target.flag,
        moneySnapshot: target.money, popSnapshot: target.pop, milSnapshot: target.milBase
      });
      addLog(`🏳️ پس از ${c.rounds} دور نبرد، دفاع ${target.flag} ${target.name} در هم شکست و منتظر تصمیم شماست.`);
      return;
    }
    if(ownPower<=0){
      c.outcome='شکست';
      addLog(`❌ نیروی اعزامی به ${target.flag} ${target.name} پس از ${c.rounds} دور نبرد نابود شد.`);
      g.approval = clamp(g.approval-6);
      return;
    }
    if(c.rounds>=4){
      const dmgFrac = 1 - c.targetPowerRemaining/c.targetPowerStart;
      target.milBase = Math.max(1, Math.round(c.targetPowerRemaining));
      const finalRatio = ownPower/Math.max(1,c.targetPowerRemaining);
      c.outcome = finalRatio>1.12 ? 'پیروزی' : finalRatio<0.88 ? 'شکست' : 'تساوی';
      if(c.outcome==='پیروزی'){ g.approval=clamp(g.approval+2); addLog(`🏆 نتیجه نهایی نبرد با ${target.flag} ${target.name}: پیروزی؛ ${Math.round(dmgFrac*100)}٪ از قدرت دشمن از بین رفت.`); }
      else if(c.outcome==='شکست'){ g.approval=clamp(g.approval-5); addLog(`❌ نتیجه نهایی نبرد با ${target.flag} ${target.name}: شکست؛ نیروهای باقی‌مانده عقب‌نشینی کردند.`); }
      else { g.approval=clamp(g.approval-1); addLog(`⚖️ نتیجه نهایی نبرد با ${target.flag} ${target.name}: تساوی؛ دو طرف بدون پیروزی قطعی عقب نشستند.`); }
      return;
    }
    stillActive.push(c);
  });
  g.campaigns = stillActive;
}

function applyConquestChoice(choice){
  const g = state.game;
  if(!g.pendingConquests || !g.pendingConquests.length) return;
  const pc = g.pendingConquests.shift();
  const target = g.allCountries.find(c=>c.id===pc.targetId);
  if(target){
    if(choice==='authoritarian'){
      g.conquered.push(pc.targetId);
      g.puppets = (g.puppets||[]).filter(id=>id!==pc.targetId);
      g.res.money += Math.round(pc.moneySnapshot*0.15);
      g.res.food += Math.round(pc.popSnapshot*1.2);
      g.res.oil += Math.round(pc.milSnapshot/12);
      g.res.steel += Math.round(pc.milSnapshot/14);
      g.pop += Math.round(pc.popSnapshot*0.5*10)/10;
      g.approval = clamp(g.approval-3);
      g.unrestLevel = clamp(g.unrestLevel+10);
      g.relations[pc.targetId] = -90;
      target.milBase = Math.max(1, Math.round(target.milBase*0.3));
      addLog(`👑 حکومت استبدادی بر ${pc.targetFlag} ${pc.targetName} تحمیل شد و این کشور رسماً الحاق شد.`);
    } else if(choice==='plunder'){
      g.res.money += Math.round(pc.moneySnapshot*0.5);
      g.res.food += Math.round(pc.popSnapshot*3);
      g.res.oil += Math.round(pc.milSnapshot/8);
      g.res.steel += Math.round(pc.milSnapshot/10);
      g.approval = clamp(g.approval+2);
      g.res.influence = Math.max(0, g.res.influence-3);
      g.relations[pc.targetId] = -95;
      target.money = Math.round(pc.moneySnapshot*0.2);
      target.milBase = Math.max(1, Math.round(pc.milSnapshot*0.5));
      target.approval = Math.max(0, (target.approval||50)-25);
      addLog(`🔥 نیروهای شما ${pc.targetFlag} ${pc.targetName} را غارت کردند و بدون الحاق عقب‌نشینی کردند.`);
    } else if(choice==='puppet'){
      g.puppets = g.puppets || [];
      if(!g.puppets.includes(pc.targetId)) g.puppets.push(pc.targetId);
      g.res.money += Math.round(pc.moneySnapshot*0.1);
      g.relations[pc.targetId] = 25;
      g.approval = clamp(g.approval+3);
      target.milBase = Math.max(1, Math.round(target.milBase*0.6));
      addLog(`🤝 دولتی دست‌نشانده در ${pc.targetFlag} ${pc.targetName} مستقر شد؛ از این پس این کشور به شما باج می‌فرستد.`);
    }
  }
  if(g.pendingConquests.length){
    state.modal = {type:'conquestChoice', id: g.pendingConquests[0].targetId};
  } else {
    state.modal = null;
  }
  saveGame(); render();
}

function countryDevelopmentFactor(g){
  const tier = {S:1.5,A:1.2,B:1.0,C:0.75}[g.tier]||1;
  return Math.max(1, Math.round((g.pop||10)*tier/20));
}
function buildingLimit(g,kind){
  const base = 2 + countryDevelopmentFactor(g);
  const special = {farm:8,factory:7,mine:5,oilRig:4,university:4,powerPlant:6,port:4,hospital:4,embassy:6,hotel:5,attraction:5,railway:5,airport:3,logisticsHub:4,researchCenter:3,carFactory:4,phoneFactory:4,laptopFactory:4,aircraftFactory:3,trainFactory:3,textileFactory:4,foodFactory:4,powerGrid:3};
  return (special[kind]||base) + Math.floor((g.res.tech||0)/35);
}
function itemBuildingLimit(g,kind){ return 2 + countryDevelopmentFactor(g) + Math.floor((g.res.tech||0)/40); }
function militaryLimit(g,kind){
  const air=['jetFighter','jetBomber','jetStealth'].includes(kind), naval=['frigate','destroyer','carrier'].includes(kind);
  const base = 20 + countryDevelopmentFactor(g)*12;
  return (air?Math.round(base*.35):naval?Math.round(base*.25):base) + Math.floor((g.res.tech||0)/25);
}

function canBuildBuilding(kind){ const g=state.game; return (g.buildings[kind]||0) < buildingLimit(g,kind); }
function itemBuildingAtCap(kind){ const g=state.game; return (g.itemBuildings[kind]||0) >= itemBuildingLimit(g,kind); }
function canRecruitUnit(kind){ const g=state.game; return (g.units[kind]||0) < militaryLimit(g,kind); }

function canAfford(cost){
  const r=state.game.res;
  return Object.keys(cost).every(k => (r[k]||0) >= cost[k]);
}
function pay(cost){
  Object.keys(cost).forEach(k=> state.game.res[k] -= cost[k]);
}

function buildItem(kind){
  const info=ITEM_BUILDINGS[kind];
  if(!canBuildItemBuilding(state.game.countryId, kind)) return;
  if(itemBuildingAtCap(kind)) { addLog(`🚫 سقف ساخت ${info.name} پر شده است.`); render(); return; }
  if(!canAfford(info.cost)) return;
  pay(info.cost);
  state.game.itemBuildings[kind]++;
  addLog(`${info.ic} یک ${info.name} ساخته شد.`);
  saveGame(); render();
}

function itemPrice(id){
  const g=state.game;
  return Math.max(1, Math.round(ITEMS[id].price * (g.marketPrices[id]||1)));
}
function sellItem(id, qty){
  const g=state.game;
  qty = Math.min(qty, Math.floor(g.items[id]||0));
  if(qty<=0) return;
  const total = itemPrice(id)*qty;
  g.items[id]-=qty;
  g.res.money+=total;
  // Dumping a lot at once softens the market for that good — sell price
  // for the NEXT batch will be lower, so hoarding and selling gradually pays off more.
  g.marketPrices[id] = Math.max(0.4, (g.marketPrices[id]||1) - Math.min(0.3, qty*0.0025));
  saveGame(); render();
}
function sellAllOf(id){ sellItem(id, Math.floor(state.game.items[id]||0)); }
function sellAllItems(){
  const g=state.game;
  // Keep back roughly one turn's domestic need so the convenience "sell everything"
  // button doesn't instantly starve the population — selling a specific item to
  // zero with "فروش همه" per-item is still allowed if the player really wants that.
  const foodNeed = Math.round(g.pop*0.22), basicNeed = Math.round(g.pop*0.12);
  const foodStock = CONSUMABLE_FOOD_ITEMS.reduce((s,id)=>s+(g.items[id]||0),0);
  const basicStock = CONSUMABLE_BASIC_ITEMS.reduce((s,id)=>s+(g.items[id]||0),0);
  let total=0;
  Object.keys(ITEMS).forEach(id=>{
    let qty=Math.floor(g.items[id]||0);
    if(CONSUMABLE_FOOD_ITEMS.includes(id) && foodStock>0){
      qty = Math.floor(qty * clamp(1-(foodNeed/foodStock),0,1));
    } else if(CONSUMABLE_BASIC_ITEMS.includes(id) && basicStock>0){
      qty = Math.floor(qty * clamp(1-(basicNeed/basicStock),0,1));
    }
    if(qty>0){
      total += itemPrice(id)*qty;
      g.items[id]-=qty;
      g.marketPrices[id] = Math.max(0.4, (g.marketPrices[id]||1) - Math.min(0.3, qty*0.0025));
    }
  });
  if(total>0){ g.res.money+=total; addLog(`💹 فروش انبار کالا در بازار جهانی (با نگه‌داشتن ذخیره مصرف داخلی): +${fmt(total)}`); }
  saveGame(); render();
}

// ---- Buying / importing items from the world market ----
// Importing always costs more than the domestic sell price (import markup),
// and the chosen transport mode further changes both cost and delivery time.
function transportSpeed(g,mode){
  const base=TRANSPORT_MODES[mode]?.speedTurns||1;
  const bonus=(g.buildings?.logisticsHub||0)+(mode==='land'?(g.buildings?.railway||0):0);
  return Math.max(1,base-Math.floor(bonus/2));
}
function importUnitCost(id, mode){
  const tm = TRANSPORT_MODES[mode] || TRANSPORT_MODES.air;
  const g=state.game;
  const logistics=1-Math.min(.18,(g.buildings?.logisticsHub||0)*.03);
  return Math.max(1, Math.round(itemPrice(id) * 1.3 * tm.costMult * logistics));
}
function openBuyItem(id){
  const g=state.game;
  const origins=g.allCountries.filter(c=>c.id!==g.countryId);
  const origin=origins.find(c=>routeAllowed(c.id,g.countryId,'sea'))||origins[0];
  const modes=origin?availableTransportModesForRoute(origin.id,g.countryId):['air'];
  state.modal = {type:'buyItem', id, qty:10, mode:modes[0]||'air', originId:origin?.id||g.countryId, destId:g.countryId};
  render();
}
function setBuyOrigin(id){ const m=state.modal; if(!m||m.type!=='buyItem')return; m.originId=id; const modes=availableTransportModesForRoute(m.originId,m.destId); m.mode=modes[0]||'air'; render(); }
function setBuyDestination(id){ const m=state.modal; if(!m||m.type!=='buyItem')return; m.destId=id; const modes=availableTransportModesForRoute(m.originId,m.destId); m.mode=modes[0]||'air'; render(); }

function setBuyQty(delta){
  const m=state.modal;
  if(!m||m.type!=='buyItem') return;
  m.qty = Math.max(1, Math.min(5000, (m.qty||1)+delta));
  render();
}
function setBuyMode(mode){
  const m=state.modal;
  if(!m||m.type!=='buyItem') return;
  m.mode = mode;
  render();
}
function confirmBuyItem(){
  const g=state.game; const m=state.modal;
  if(!m||m.type!=='buyItem') return;
  const modes = availableTransportModesForRoute(m.originId||g.countryId,m.destId||g.countryId);
  if(!modes.includes(m.mode)) return;
  if((m.destId||g.countryId)!==g.countryId) return;
  const unitCost = importUnitCost(m.id, m.mode);
  const total = unitCost * m.qty;
  if(g.res.money < total) return;
  g.res.money -= total;
  const tm = TRANSPORT_MODES[m.mode];
  if(!g.shipments) g.shipments=[];
  g.shipments.push({
    id: 'ship_'+Date.now()+Math.floor(Math.random()*10000),
    item: m.id, qty: m.qty, mode: m.mode,
    sentTurn: g.turn, arriveTurn: g.turn + transportSpeed(g,m.mode)
  });
  // Buying pressures the world price upward slightly — the mirror image of
  // the sell-side "dumping softens the price" effect.
  g.marketPrices[m.id] = Math.min(2.2, (g.marketPrices[m.id]||1) + Math.min(0.25, m.qty*0.002));
  addLog(`${tm.ic} سفارش واردات ${fmt(m.qty)} واحد ${ITEMS[m.id].name} (${tm.name}) ثبت شد — تخمین رسیدن: ${tm.speedTurns} نوبت دیگر.`);
  state.modal = null;
  saveGame(); render();
}
function processShipments(g){
  if(!g.shipments || !g.shipments.length) return;
  const still=[];
  g.shipments.forEach(s=>{
    if(g.turn >= s.arriveTurn){
      g.items[s.item] = (g.items[s.item]||0) + s.qty;
      const tm = TRANSPORT_MODES[s.mode]||{ic:'📦'};
      addLog(`${tm.ic} محموله وارداتی ${fmt(s.qty)} واحد ${ITEMS[s.item].name} به کشور رسید.`);
    } else {
      still.push(s);
    }
  });
  g.shipments = still;
}

function simulateCompanies(g){
  const corpTaxRate = clamp(0.08 + (g.taxRate-1)*0.10, 0.03, 0.22);
  let corpTaxCollected = 0;
  g.companies.forEach(co=>{
    ensureCarResearch(co);
    ensurePhoneResearch(co);
    checkCompanyResearch(co);
    const sector=COMPANY_SECTORS[co.sector];
    const requiredFactory={car:'carFactory',phone:'phoneFactory',electronics:'laptopFactory'}[co.sector];
    const factoryReady=!requiredFactory || (g.buildings?.[requiredFactory]||0)>0;
    if(!factoryReady){ co.lastSold=0; co.lastNet=0; co.reputation=clamp(co.reputation-0.5,5,100); return; }
    // Competitors drift slightly, nibbling or losing market share
    (co.competitors||[]).forEach(r=>{ r.share = clamp(r.share + (Math.random()-0.5)*6, 5, 60); });
    const avgRivalShare = ((co.competitors||[]).reduce((s,r)=>s+r.share,0) / Math.max(1,(co.competitors||[]).length)) || 25;
    const staffFactor = Math.min(1, co.employees / Math.max(1,co.capacity*0.8));


    if(co.sector==='phone' && co.products && co.products.length){
      const activeProducts = co.products.filter(p=>p.active);
      let totalSold=0, totalRevenue=0, totalCost=0;
      activeProducts.forEach(p=>{
        const ratingFactor=(p.rating||5)/10;
        const demandFactor=0.30+(co.marketing/100)*0.32+(co.reputation/100)*0.24+ratingFactor*0.48-(avgRivalShare/100)*0.18+Math.random()*0.22;
        const capShare=co.capacity/Math.max(1,activeProducts.length);
        const produced=Math.max(0,Math.round(capShare*staffFactor)); p.stock=(p.stock||0)+produced; const sold=Math.min(p.stock,Math.max(0,Math.round(capShare*staffFactor*Math.min(1.35,Math.max(0.05,demandFactor))))); p.stock-=sold;
        p.lastSold=sold; p.totalSold=(p.totalSold||0)+sold; totalSold+=sold; totalRevenue+=sold*p.price; totalCost+=sold*p.cost;
      });
      const cost=totalCost+co.capacity*8+co.employees*6+co.factories*40;
      let net=totalRevenue-cost;
      if(net>0){const t=net*corpTaxRate;corpTaxCollected+=t;net-=t;}
      co.cash+=net; co.totalRevenue+=totalRevenue; co.reputation=clamp(co.reputation+(net>0?0.6:-1),5,100); co.marketing=Math.max(0,co.marketing-4);
      co.marketShare=clamp(100-avgRivalShare*(co.competitors?co.competitors.length:0)/2,5,90); co.lastSold=totalSold; co.lastNet=net;
      return;
    }
    if(co.sector==='car' && co.products && co.products.length){
      const activeProducts = co.products.filter(p=>p.active);
      let totalSold=0, totalRevenue=0, totalCost=0;
      activeProducts.forEach(p=>{
        const ratingFactor = (p.rating||5)/10;
        const demandFactor = 0.28
          + (co.marketing/100)*0.3
          + (co.reputation/100)*0.25
          + ratingFactor*0.5
          - (avgRivalShare/100)*0.2
          + Math.random()*0.22;
        const capShare = co.capacity/Math.max(1,activeProducts.length);
        const produced = Math.max(0, Math.round(capShare * staffFactor)); p.stock=(p.stock||0)+produced; const sold = Math.min(p.stock, Math.max(0, Math.round(capShare * staffFactor * Math.min(1.3, Math.max(0.05,demandFactor))))); p.stock-=sold;
        p.lastSold = sold;
        p.totalSold = (p.totalSold||0)+sold;
        totalSold += sold;
        totalRevenue += sold*p.price;
        totalCost += sold*p.cost;
      });
      const cost = totalCost + co.capacity*8 + co.employees*6 + co.factories*40;
      let net = totalRevenue-cost;
      if(net>0){ const t=net*corpTaxRate; corpTaxCollected+=t; net-=t; }
      co.cash += net;
      co.totalRevenue += totalRevenue;
      co.reputation = clamp(co.reputation + (net>0?0.6:-1), 5, 100);
      co.marketing = Math.max(0, co.marketing-4);
      co.marketShare = clamp(100 - avgRivalShare*(co.competitors?co.competitors.length:0)/2, 5, 90);
      co.lastSold = totalSold; co.lastNet = net;
      return;
    }

    const tier=sector.tiers[co.tierIdx];
    const demandFactor = 0.35
      + (co.marketing/100)*0.4
      + (co.reputation/100)*0.3
      + (co.quality/100)*0.35
      - (avgRivalShare/100)*0.25
      + Math.random()*0.25;
    const sold = Math.max(0, Math.round(co.capacity * staffFactor * Math.min(1.3, Math.max(0.1,demandFactor))));
    const revenue = sold*tier.price;
    const cost = sold*tier.cost + co.capacity*8 + co.employees*6 + co.factories*40;
    let net = revenue-cost;
    if(net>0){ const t=net*corpTaxRate; corpTaxCollected+=t; net-=t; }
    co.cash += net;
    co.totalRevenue += revenue;
    co.reputation = clamp(co.reputation + (net>0?0.6:-1), 5, 100);
    co.marketing = Math.max(0, co.marketing-4);
    co.marketShare = clamp(100 - avgRivalShare*(co.competitors?co.competitors.length:0)/2, 5, 90);
    co.lastSold = sold; co.lastNet = net;
  });
  g.res.money += Math.round(corpTaxCollected);
  return Math.round(corpTaxCollected);
}

function reviewCarProduct(co, product){
  // Realistic review logic: build quality dominates, brand reputation and
  // feature richness matter, and price is only judged relative to what the
  // car's own quality would justify (an expensive-but-great car isn't
  // punished the way it used to be — value-for-money is one factor, not the whole score).
  const qualityScore = product.quality/10;                                   // 0–10, main driver
  const featureScore = Math.min(10, (product.options||[]).length*1.3);       // more equipped trims score better
  const brandScore = clamp(((co.reputation||40))/10, 0, 10);
  const expectedPrice = 500 + product.quality*160;                           // what this quality level "should" cost

  const valueScore = clamp(5 + (valueRatio-1)*4, 0, 10);                     // mild bonus/penalty only

// ---- Covert / cyber & clandestine operations ----
function totalCovertUnits(g){
  return Object.values(g.covertUnits||{}).reduce((s,v)=>s+v,0);
}
function covertSlotCost(g){
  return {money: Math.round(10000 + g.covertSlots*3800), influence: Math.round(4 + g.covertSlots*2)};
}
function expandCovertSlots(){
  const g=state.game;
  const cost=covertSlotCost(g);
  if(!canAfford(cost)) return;
  pay(cost);
  g.covertSlots++;
  addLog(`🕶️ ظرفیت جدیدی برای واحدهای مخفی ایجاد شد؛ اکنون می‌توانید تا ${g.covertSlots} واحد داشته باشید.`);
  saveGame(); render();
}
function recruitCovert(kind){
  const g=state.game;
  const info=COVERT_UNITS[kind];
  if(totalCovertUnits(g) >= g.covertSlots) return;
  if(!canAfford(info.cost)) return;
  pay(info.cost);
  g.covertUnits[kind]++;
  addLog(`${info.ic} یک ${info.name} تشکیل شد.`);
  saveGame(); render();
}
function launchCovertOp(opKind, tid){
  const g=state.game;
  const op = COVERT_OPS[opKind];
  const target = g.allCountries.find(c=>c.id===tid);
  if(!op || !target) return;
  if(!g.covertUnits[op.reqUnit] || g.covertUnits[op.reqUnit]<=0) return;
  if(!canAfford(op.cost)) return;
  pay(op.cost);
  const power = (g.covertUnits[op.reqUnit]||0) * (COVERT_UNITS[op.reqUnit].power||10);
  const success = Math.random() < clamp(0.35 + power/150, 0.15, 0.9);
  if(success){
    if(op.effect==='econ'){
      const loss = Math.round(target.money*0.12);
      target.money = Math.max(0, target.money-loss);
      target.milBase = Math.max(10, Math.round(target.milBase*0.95));
      target.approval = Math.max(0, (target.approval||50)-5);
      g.res.influence = Math.max(0, g.res.influence-1);
      addLog(`${op.ic} خرابکاری سایبری، شبکه‌ی برق و بانکی ${target.flag} ${target.name} را مختل کرد؛ خسارتی معادل ${fmt(loss)} به اقتصاد هدف وارد شد و آمادگی نظامی آن افت کرد.`);
    } else if(op.effect==='tech'){
      const stolenTech = Math.round(4+Math.random()*4);
      g.res.tech += stolenTech;
      const stolenInfo = {
        country: target.name, flag: target.flag,
        tech: Math.round((target.milBase||50)/20)+stolenTech,
        milBase: target.milBase, money: target.money, approval: Math.round(target.approval||50)
      };
      addLog(`${op.ic} اطلاعات محرمانه فناوری از ${target.flag} ${target.name} سرقت شد (+${stolenTech} فناوری).`);
      state.modal = {type:'stolenIntel', data:stolenInfo, gained:stolenTech};
    } else if(op.effect==='treasury'){
      const stolen = Math.round(target.money*0.5);
      target.money = Math.max(0, target.money-stolen);
      g.res.money += stolen;
      addLog(`${op.ic} خزانه‌داری ${target.flag} ${target.name} هک شد؛ ${fmt(stolen)} (نیمی از ذخایر هدف) به خزانه شما منتقل شد!`);
    }
    g.relations[tid] = clamp((g.relations[tid]||0)-15, -100, 100);
  } else {
    g.approval = clamp(g.approval-3);
    g.relations[tid] = clamp((g.relations[tid]||0)-25, -100, 100);
    addLog(`⚠️ عملیات «${op.name}» علیه ${target.flag} ${target.name} لو رفت و روابط را تیره کرد.`);
  }
  saveGame(); render();
}

// ---- Proxy militia groups: named, personalized forces tied to a target country ----
const PROXY_PREFIXES = ['جبهه','ارتش','جنبش','شورای','اتحادیه','سپاه','ستاد'];
const PROXY_SUFFIXES = ['آزادی‌بخش','مقاومت مردمی','انقلابی','ملی','رهایی','عدالت‌خواه','مردمی زیرزمینی'];
function generateProxyName(targetName){
  const p = PROXY_PREFIXES[Math.floor(Math.random()*PROXY_PREFIXES.length)];
  const s = PROXY_SUFFIXES[Math.floor(Math.random()*PROXY_SUFFIXES.length)];
  return `${p} ${s} ${targetName||''}`.trim();
}
// Each named proxy group can be tasked with one of several distinct actions
// against its assigned target — not just generic "destabilization".
const PROXY_OPS = {
  destabilize:        {name:'بی‌ثبات‌سازی سیاسی', ic:'🔥', cost:{money:3000}, relHit:15, desc:'کاهش محبوبیت دولت هدف از طریق شایعه‌پراکنی و تحریک سیاسی'},
  sabotageInfra:       {name:'نابودی زیرساخت‌ها', ic:'💣', cost:{money:2600}, relHit:18, desc:'خرابکاری در نیروگاه‌ها، جاده‌ها و پایگاه‌های نظامی هدف'},
  mobilizeRevolution:  {name:'بسیج مردم برای انقلاب', ic:'✊', cost:{money:4200}, relHit:20, desc:'سازمان‌دهی قیام مردمی گسترده علیه دولت هدف'},
  bombing:             {name:'عملیات بمب‌گذاری', ic:'💥', cost:{money:3800}, relHit:30, desc:'خسارت مستقیم و تلفات؛ ریسک واکنش شدید بین‌المللی'}
};
function recruitProxyGroup(tid){
  const g=state.game;
  if(!tid) return;
  const info = COVERT_UNITS.militiaCell;
  if(totalCovertUnits(g) >= g.covertSlots) return;

    targetId:tid, strength, loyalty, founded:g.turn};

  const g=state.game;

function disbandProxyGroup(id){

function launchProxyOp(id, opKind){
  const g=state.game;
  const pg = (g.proxyGroups||[]).find(p=>p.id===id);
  if(!pg) return;
  const op = PROXY_OPS[opKind];
  if(!op) return;
  const target = g.allCountries.find(c=>c.id===pg.targetId);
  if(!target) return;
  if(!canAfford(op.cost)) return;
  pay(op.cost);
  const chance = clamp(0.3 + pg.strength/120 + (pg.loyalty-50)/200, 0.1, 0.9);
  const success = Math.random() < chance;
  if(success){
    if(opKind==='destabilize'){
      target.approval = Math.max(0, (target.approval||50) - Math.round(8+pg.strength/10));
      addLog(`🔥 «${pg.name}» عملیات بی‌ثبات‌سازی موفقی علیه ${target.flag} ${target.name} انجام داد؛ محبوبیت دولت هدف کاهش یافت.`);
    } else if(opKind==='sabotageInfra'){
      target.milBase = Math.max(10, Math.round(target.milBase*(1-(0.06+pg.strength/500))));
      target.money = Math.max(0, Math.round(target.money-4000-pg.strength*80));
      addLog(`💣 «${pg.name}» زیرساخت‌های کلیدی ${target.flag} ${target.name} (نیروگاه‌ها و پایگاه‌های نظامی) را منهدم کرد؛ توان نظامی و اقتصادی هدف افت کرد.`);
    } else if(opKind==='mobilizeRevolution'){
      target.approval = Math.max(0, (target.approval||50) - Math.round(18+pg.strength/6));
      g.res.influence += 1;
      addLog(`✊ «${pg.name}» مردم ${target.flag} ${target.name} را برای قیام بسیج کرد؛ محبوبیت دولت هدف سقوط چشمگیری کرد.`);
    } else if(opKind==='bombing'){
      target.money = Math.max(0, Math.round(target.money-6000-pg.strength*60));
      target.pop = Math.max(1, Math.round((target.pop||10)*0.995*10)/10);
      g.approval = clamp(g.approval-2);
      g.res.influence = Math.max(0, g.res.influence-2);
      addLog(`💥 «${pg.name}» عملیات بمب‌گذاری در ${target.flag} ${target.name} را با موفقیت اجرا کرد؛ افکار عمومی جهانی نسبت به این اقدام واکنش نشان داد.`);
    }
    g.relations[pg.targetId] = clamp((g.relations[pg.targetId]||0) - op.relHit, -100, 100);
    pg.loyalty = clamp(pg.loyalty - Math.round(3+Math.random()*6), 0, 100);
  } else {
    pg.loyalty = clamp(pg.loyalty - Math.round(15+Math.random()*15), 0, 100);
    g.approval = clamp(g.approval-2);
    g.relations[pg.targetId] = clamp((g.relations[pg.targetId]||0)-20, -100, 100);
    addLog(`⚠️ عملیات «${op.name}» توسط «${pg.name}» لو رفت؛ وفاداری گروه سقوط کرد و روابط تیره‌تر شد.`);
    if(pg.loyalty<=0){
      g.proxyGroups = g.proxyGroups.filter(p=>p.id!==id);
      g.covertUnits.militiaCell = Math.max(0,(g.covertUnits.militiaCell||0)-1);
      addLog(`💥 گروهک «${pg.name}» از هم پاشید و منحل شد.`);
    }
  }
  saveGame(); render();
}
